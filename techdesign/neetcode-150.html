lap.","example":"Input: intervals = [(0,30),(5,10),(15,20)] → Output: false","insight":"Sort by start time; if any meeting starts before the previous one ends, there's a conflict.","time":"O(n log n)","space":"O(1)","code":"def canAttendMeetings(intervals):\n    intervals.sort(key=lambda x: x[0])\n    for i in range(1, len(intervals)):\n        if intervals[i][0] < intervals[i-1][1]:\n            return False\n    return True"},{"id":"meeting-rooms-ii","name":"Meeting Rooms II","difficulty":"Medium","pattern":"Intervals","url":"https://leetcode.com/problems/meeting-rooms-ii/","prompt":"You're given an array of meeting time intervals. Return the minimum number of conference rooms required so that all the meetings can be held without overlapping in the same room.","example":"Input: intervals = [(0,30),(5,10),(15,20)] → Output: 2","insight":"Separate and sort start times and end times independently. Sweep through starts; each time a meeting starts before the earliest ongoing meeting ends, you need another room — otherwise reuse the freed one.","time":"O(n log n)","space":"O(n)","code":"def minMeetingRooms(intervals):\n    starts = sorted(i[0] for i in intervals)\n    ends = sorted(i[1] for i in intervals)\n    rooms = 0\n    maxRooms = 0\n    s = e = 0\n    while s < len(starts):\n        if starts[s] < ends[e]:\n            rooms += 1\n            s += 1\n        else:\n            rooms -= 1\n            e += 1\n        maxRooms = max(maxRooms, rooms)\n    return maxRooms"},{"id":"min-interval-include-query","name":"Minimum Interval to Include Each Query","difficulty":"Hard","pattern":"Intervals","url":"https://leetcode.com/problems/minimum-interval-to-include-each-query/","prompt":"You're given a list of intervals and a list of query points. For each query, find the size of the smallest interval that contains that query point, or -1 if no interval contains it.","example":"Input: intervals = [[1,4],[2,4],[3,6],[4,4]], queries = [2,3,4,5] → Output: [3,3,1,4]","insight":"Sort intervals by start and queries by value. Sweep queries in order, pushing all intervals that have started into a min-heap keyed by size, popping expired ones (end < query) off the top first.","time":"O((n + q) log n)","space":"O(n)","code":"import heapq\ndef minInterval(intervals, queries):\n    intervals.sort()\n    minHeap = []\n    res = {}\n    i = 0\n    for q in sorted(queries):\n        while i < len(intervals) and intervals[i][0] <= q:\n            l, r = intervals[i]\n            heapq.heappush(minHeap, (r - l + 1, r))\n            i += 1\n        while minHeap and minHeap[0][1] < q:\n            heapq.heappop(minHeap)\n        res[q] = minHeap[0][0] if minHeap else -1\n    return [res[q] for q in queries]"},{"id":"rotate-image","name":"Rotate Image","difficulty":"Medium","pattern":"Math & Geometry","url":"https://leetcode.com/problems/rotate-image/","prompt":"You're given an n x n 2D matrix representing an image. Rotate the image by 90 degrees clockwise, in place, without allocating another matrix.","example":"Input: matrix = [[1,2,3],[4,5,6],[7,8,9]] → Output: [[7,4,1],[8,5,2],[9,6,3]]","insight":"Two simple transforms compose into a rotation: transpose the matrix (swap rows/columns), then reverse each row.","time":"O(n^2)","space":"O(1)","code":"def rotate(matrix):\n    n = len(matrix)\n    for r in range(n):\n        for c in range(r + 1, n):\n            matrix[r][c], matrix[c][r] = matrix[c][r], matrix[r][c]\n    for row in matrix:\n        row.reverse()"},{"id":"spiral-matrix","name":"Spiral Matrix","difficulty":"Medium","pattern":"Math & Geometry","url":"https://leetcode.com/problems/spiral-matrix/","prompt":"You're given an m x n matrix. Return all elements of the matrix in spiral order, starting from the top-left and moving clockwise inward.","example":"Input: matrix = [[1,2,3],[4,5,6],[7,8,9]] → Output: [1,2,3,6,9,8,7,4,5]","insight":"Maintain four shrinking boundaries (top, bottom, left, right); traverse right along top, down along right, left along bottom, up along left, tightening the boundary after each side.","time":"O(rows*cols)","space":"O(1) extra","code":"def spiralOrder(matrix):\n    res = []\n    top, bottom = 0, len(matrix) - 1\n    left, right = 0, len(matrix[0]) - 1\n    while top <= bottom and left <= right:\n        for c in range(left, right + 1):\n            res.append(matrix[top][c])\n        top += 1\n        for r in range(top, bottom + 1):\n            res.append(matrix[r][right])\n        right -= 1\n        if top <= bottom:\n            for c in range(right, left - 1, -1):\n                res.append(matrix[bottom][c])\n            bottom -= 1\n        if left <= right:\n            for r in range(bottom, top - 1, -1):\n                res.append(matrix[r][left])\n            left += 1\n    return res"},{"id":"set-matrix-zeroes","name":"Set Matrix Zeroes","difficulty":"Medium","pattern":"Math & Geometry","url":"https://leetcode.com/problems/set-matrix-zeroes/","prompt":"You're given an m x n matrix. If any element is 0, set its entire row and entire column to 0 — do this in place.","example":"Input: matrix = [[1,1,1],[1,0,1],[1,1,1]] → Output: [[1,0,1],[0,0,0],[1,0,1]]","insight":"Use the matrix's own first row and first column as markers for which rows/columns need zeroing, with separate flags for whether the first row/column themselves need zeroing — avoids O(m+n) extra space.","time":"O(rows*cols)","space":"O(1)","code":"def setZeroes(matrix):\n    rows, cols = len(matrix), len(matrix[0])\n    firstRowZero = any(matrix[0][c] == 0 for c in range(cols))\n    firstColZero = any(matrix[r][0] == 0 for r in range(rows))\n    for r in range(1, rows):\n        for c in range(1, cols):\n            if matrix[r][c] == 0:\n                matrix[0][c] = 0\n                matrix[r][0] = 0\n    for r in range(1, rows):\n        for c in range(1, cols):\n            if matrix[0][c] == 0 or matrix[r][0] == 0:\n                matrix[r][c] = 0\n    if firstRowZero:\n        for c in range(cols):\n            matrix[0][c] = 0\n    if firstColZero:\n        for r in range(rows):\n            matrix[r][0] = 0"},{"id":"happy-number","name":"Happy Number","difficulty":"Easy","pattern":"Math & Geometry","url":"https://leetcode.com/problems/happy-number/","prompt":"A number is 'happy' if, starting from it and repeatedly replacing the number with the sum of the squares of its digits, the process eventually reaches 1 (rather than looping endlessly). Determine if a given number n is happy.","example":"Input: n = 19 → Output: true","insight":"If a number isn't happy, the sum-of-squares sequence enters a cycle instead of reaching 1 — so this is just cycle detection (Floyd's slow/fast) on an implicit sequence.","time":"O(log n) per step","space":"O(1)","code":"def isHappy(n):\n    def next_num(x):\n        return sum(int(d)**2 for d in str(x))\n    slow, fast = n, next_num(n)\n    while fast != 1 and slow != fast:\n        slow = next_num(slow)\n        fast = next_num(next_num(fast))\n    return fast == 1"},{"id":"plus-one","name":"Plus One","difficulty":"Easy","pattern":"Math & Geometry","url":"https://leetcode.com/problems/plus-one/","prompt":"You're given an array of digits representing a large non-negative integer, most significant digit first. Increment the integer by one and return the resulting array of digits.","example":"Input: digits = [1,2,3] → Output: [1,2,4]","insight":"Walk from the last digit backward: if it's less than 9, just increment and stop; if it's 9, it becomes 0 and the carry continues left. Prepend a 1 if the carry survives past the first digit.","time":"O(n)","space":"O(1) extra","code":"def plusOne(digits):\n    for i in range(len(digits) - 1, -1, -1):\n        if digits[i] < 9:\n            digits[i] += 1\n            return digits\n        digits[i] = 0\n    return [1] + digits"},{"id":"powx-n","name":"Pow(x, n)","difficulty":"Medium","pattern":"Math & Geometry","url":"https://leetcode.com/problems/powx-n/","prompt":"Implement pow(x, n), which calculates x raised to the integer power n, handling negative exponents (fractional result) efficiently — better than O(n) multiplications.","example":"Input: x = 2.0, n = 10 → Output: 1024.0","insight":"Fast exponentiation by squaring: halve the exponent each recursive step, squaring the base, which turns O(n) multiplications into O(log n).","time":"O(log n)","space":"O(log n) recursion","code":"def myPow(x, n):\n    def helper(x, n):\n        if x == 0:\n            return 0\n        if n == 0:\n            return 1\n        half = helper(x, n // 2)\n        result = half * half\n        return result * x if n % 2 else result\n    res = helper(x, abs(n))\n    return res if n >= 0 else 1 / res"},{"id":"multiply-strings","name":"Multiply Strings","difficulty":"Medium","pattern":"Math & Geometry","url":"https://leetcode.com/problems/multiply-strings/","prompt":"You're given two non-negative integers num1 and num2 represented as strings. Return their product, also as a string, without converting the inputs directly to integers or using built-in big-integer libraries.","example":"Input: num1 = \"123\", num2 = \"456\" → Output: \"56088\"","insight":"Simulate grade-school long multiplication: multiplying digit i of num1 by digit j of num2 contributes to positions i+j and i+j+1 of the result array, then handle carries at the end.","time":"O(m*n)","space":"O(m+n)","code":"def multiply(num1, num2):\n    if num1 == '0' or num2 == '0':\n        return '0'\n    m, n = len(num1), len(num2)\n    res = [0] * (m + n)\n    for i in range(m - 1, -1, -1):\n        for j in range(n - 1, -1, -1):\n            mul = int(num1[i]) * int(num2[j])\n            p1, p2 = i + j, i + j + 1\n            total = mul + res[p2]\n            res[p2] = total % 10\n            res[p1] += total // 10\n    result = ''.join(map(str, res)).lstrip('0')\n    return result"},{"id":"detect-squares","name":"Detect Squares","difficulty":"Medium","pattern":"Math & Geometry","url":"https://leetcode.com/problems/detect-squares/","prompt":"Design a data structure that supports adding points on a 2D plane one at a time, and querying how many axis-aligned squares can be formed using previously added points together with a given query point as one corner.","example":"add([3,10]) → add([11,2]) → add([3,2]) → count([11,10]) → 1","insight":"Keep a count of each point added. For a query point, try every other point sharing its x-coordinate as a potential diagonal-adjacent corner, then check if the other two square corners exist, multiplying their counts.","time":"O(n) per query","space":"O(n)","code":"from collections import defaultdict\nclass DetectSquares:\n    def __init__(self):\n        self.counts = defaultdict(int)\n        self.ptsByX = defaultdict(list)\n    def add(self, point):\n        x, y = point\n        self.counts[(x, y)] += 1\n        self.ptsByX[x].append(y)\n    def count(self, point):\n        x, y = point\n        total = 0\n        for y2 in self.ptsByX[x]:\n            side = y2 - y\n            if side == 0:\n                continue\n            for x2 in (x + side, x - side):\n                total += self.counts[(x, y2)] * self.counts[(x2, y)] * self.counts[(x2, y2)]\n        return total"},{"id":"single-number","name":"Single Number","difficulty":"Easy","pattern":"Bit Manipulation","url":"https://leetcode.com/problems/single-number/","prompt":"You're given a non-empty array of integers where every element appears exactly twice except for one. Find that single element, using linear time and O(1) extra space.","example":"Input: nums = [4,1,2,1,2] → Output: 4","insight":"XOR-ing every number together cancels all pairs to 0 (a XOR a = 0), leaving only the number that appears once.","time":"O(n)","space":"O(1)","code":"def singleNumber(nums):\n    res = 0\n    for n in nums:\n        res ^= n\n    return res"},{"id":"number-of-1-bits","name":"Number of 1 Bits","difficulty":"Easy","pattern":"Bit Manipulation","url":"https://leetcode.com/problems/number-of-1-bits/","prompt":"You're given an unsigned integer. Return the number of '1' bits (set bits, also called the Hamming weight) in its binary representation.","example":"Input: n = 00000000000000000000000000001011 → Output: 3","insight":"n & (n-1) clears the lowest set bit. Repeating that and counting iterations gives the number of set bits in O(popcount) time.","time":"O(number of set bits)","space":"O(1)","code":"def hammingWeight(n):\n    count = 0\n    while n:\n        n &= n - 1\n        count += 1\n    return count"},{"id":"counting-bits","name":"Counting Bits","difficulty":"Easy","pattern":"Bit Manipulation","url":"https://leetcode.com/problems/counting-bits/","prompt":"You're given an integer n. Return an array ans of length n+1 where ans[i] is the number of 1 bits in the binary representation of i, for every i from 0 to n.","example":"Input: n = 5 → Output: [0,1,1,2,1,2]","insight":"dp[i] = dp[i >> 1] + (i & 1): stripping the lowest bit off i via right shift reuses a previously computed answer, and the lowest bit itself adds 0 or 1.","time":"O(n)","space":"O(n)","code":"def countBits(n):\n    dp = [0] * (n + 1)\n    for i in range(1, n + 1):\n        dp[i] = dp[i >> 1] + (i & 1)\n    return dp"},{"id":"reverse-bits","name":"Reverse Bits","difficulty":"Easy","pattern":"Bit Manipulation","url":"https://leetcode.com/problems/reverse-bits/","prompt":"You're given a 32-bit unsigned integer. Return the integer obtained by reversing the bits of its binary representation.","example":"Input: n = 00000010100101000001111010011100 → Output: 964176192","insight":"Build the result bit by bit: shift the result left, OR in the lowest bit of n, then shift n right — 32 iterations reverse the full word.","time":"O(32) = O(1)","space":"O(1)","code":"def reverseBits(n):\n    res = 0\n    for _ in range(32):\n        res = (res << 1) | (n & 1)\n        n >>= 1\n    return res"},{"id":"missing-number","name":"Missing Number","difficulty":"Easy","pattern":"Bit Manipulation","url":"https://leetcode.com/problems/missing-number/","prompt":"You're given an array containing n distinct numbers taken from the range [0, n]. Find the one number in that range that is missing from the array.","example":"Input: nums = [3,0,1] → Output: 2","insight":"XOR every index 0..n with every array value — every present number cancels with its index pairing, leaving only the missing number (an elegant alternative to sum-formula subtraction).","time":"O(n)","space":"O(1)","code":"def missingNumber(nums):\n    res = len(nums)\n    for i, n in enumerate(nums):\n        res ^= i ^ n\n    return res"},{"id":"sum-of-two-integers","name":"Sum of Two Integers","difficulty":"Medium","pattern":"Bit Manipulation","url":"https://leetcode.com/problems/sum-of-two-integers/","prompt":"You're given two integers a and b. Calculate and return their sum without using the '+' or '-' operators, relying only on bitwise operations.","example":"Input: a = 1, b = 2 → Output: 3","insight":"XOR gives the sum ignoring carries; AND shifted left by 1 gives the carry bits. Repeat combining these until there's no carry left — this is literally how binary adders work in hardware.","time":"O(1) — bounded by integer width","space":"O(1)","code":"def getSum(a, b):\n    mask = 0xFFFFFFFF\n    while b & mask:\n        carry = (a & b) << 1\n        a = a ^ b\n        b = carry\n    a = a & mask\n    return a if a < 0x80000000 else ~(a ^ mask)"},{"id":"reverse-integer","name":"Reverse Integer","difficulty":"Medium","pattern":"Bit Manipulation","url":"https://leetcode.com/problems/reverse-integer/","prompt":"You're given a signed 32-bit integer x. Reverse the digits of x, and return the result; if the reversed integer would overflow the signed 32-bit range, return 0 instead.","example":"Input: x = 123 → Output: 321","insight":"Pop digits off the end with %10 and //10, building the reversed number one digit at a time, checking the 32-bit signed bounds before each push to detect overflow early.","time":"O(log n) digits","space":"O(1)","code":"def reverse(x):\n    sign = -1 if x < 0 else 1\n    x = abs(x)\n    res = 0\n    while x:\n        digit = x % 10\n        x //= 10\n        res = res * 10 + digit\n    res *= sign\n    if res < -2**31 or res > 2**31 - 1:\n        return 0\n    return res"}];

/* =========================================================
   SCHEDULING — simplified Leitner / interval system
   box 0: again (due <10 min later, effectively "still in session")

   box 2: 3 days
   box 3: 7 days
   box 4: 14 days
   box 5: 30 days
   box 6: 60 days (mastered ceiling)

const BOX_DAYS = [0, 1, 3, 7, 14, 30, 60];

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function highlightCode(code){
  const kws = ["def","return","if","elif","else","for","while","in","not","and","or","class","self","import","from","True","False","None","break","continue","lambda","yield","try","except","raise","is","global","del","with","as"];
  let esc = escapeHtml(code);
  const re = new RegExp("\\b(" + kws.join("|") + ")\\b", "g");
  return esc.replace(re, '<span class="kw">$1</span>');
}

let STATE = {}; // id -> {box, due (ISO), reps}
let ORDER = [];
let position = 0;
let currentCat = null;

async function loadState(){
  try{
    const r = localStorage.getItem('neetcode150-state');
    STATE = r ? JSON.parse(r) : {};
  }catch(e){ STATE = {}; }
  try{
    const s = localStorage.getItem('neetcode150-streak');
    STREAK = s ? JSON.parse(s) : {count:0, last:null};
  }catch(e){ STREAK = {count:0, last:null}; }
}
async function saveState(){
  try{ localStorage.setItem('neetcode150-state', JSON.stringify(STATE)); }catch(e){}
}
async function saveStreak(){
  try{ localStorage.setItem('neetcode150-streak', JSON.stringify(STREAK)); }catch(e){}
}

let STREAK = {count:0, last:null};

function todayStr(){ return new Date().toISOString().slice(0,10); }

function cardState(id){
  if(!STATE[id]) STATE[id] = {box:0, due:new Date(0).toISOString(), reps:0};
  return STATE[id];
}
function isDue(id){
  const st = cardState(id);
  return new Date(st.due).getTime() <= Date.now();
}
function rate(id, grade){
  const st = cardState(id);
  st.reps += 1;
  if(grade === 0){ st.box = 0; }
  else if(grade === 1){ st.box = Math.max(1, st.box); }
  else if(grade === 2){ st.box = Math.min(BOX_DAYS.length - 1, st.box + 1); }
  else { st.box = Math.min(BOX_DAYS.length - 1, st.box + 2); }
  const days = BOX_DAYS[st.box];
  const due = new Date();
  if(days === 0){ due.setMinutes(due.getMinutes() + 8); }
  else { due.setDate(due.getDate() + days); }
  st.due = due.toISOString();
  saveState();

  const t = todayStr();
  if(STREAK.last !== t){
    STREAK.count = (STREAK.last === yesterdayStr()) ? STREAK.count + 1 : 1;
    STREAK.last = t;
    saveStreak();
  }
}
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }

/* =========================================================
   CATEGORIES
   ========================================================= */
function categories(){
  const map = new Map();
  NC150.forEach(p => {
    if(!map.has(p.pattern)) map.set(p.pattern, []);
    map.get(p.pattern).push(p);
  });
  return map;
}

function renderHome(){
  document.getElementById('streakPill').textContent = (STREAK.count||0) + '🔥';
  const due = NC150.filter(p => isDue(p.id));
  document.getElementById('dueNum').textContent = due.length;
  const banner = document.getElementById('dueBanner');
  banner.disabled = due.length === 0;

  const cats = categories();
  const list = document.getElementById('catList');
  list.innerHTML = '';
  let i = 0;
  for(const [name, probs] of cats){
    i++;
    const dueCount = probs.filter(p => isDue(p.id)).length;
    const masteredCount = probs.filter(p => cardState(p.id).box >= 4).length;
    const row = document.createElement('button');
    row.className = 'cat-row' + (dueCount>0 ? ' has-due' : '');
    row.innerHTML = `
      <span class="idx">${String(i).padStart(2,'0')}</span>
      <span class="name">${name}</span>
      <span class="mastery"><i style="width:${Math.round(100*masteredCount/probs.length)}%"></i></span>
      <span class="count">${dueCount>0 ? dueCount+' due' : probs.length}</span>
    `;
    row.onclick = () => startSession(name, probs);
    list.appendChild(row);
  }
}

/* =========================================================
   STUDY SESSION
   ========================================================= */
function startSession(catName, pool){
  currentCat = catName;
  const due = pool.filter(p => isDue(p.id));
  ORDER = (due.length ? due : pool.slice()).sort(() => Math.random()-0.5);
  position = 0;
  showView('study');
  renderCard();
}
function startDueAll(){
  const due = NC150.filter(p => isDue(p.id));
  if(!due.length) return;
  currentCat = 'Due Today';
  ORDER = due.sort(() => Math.random()-0.5);
  position = 0;
  showView('study');
  renderCard();
}

function showView(name){
  document.getElementById('view-root').classList.toggle('active', name==='root');
  document.getElementById('view-home').classList.toggle('active', name==='home');
  document.getElementById('view-study').classList.toggle('active', name==='study');
  document.getElementById('view-tinder').classList.toggle('active', name==='tinder');
  if(name === 'root') document.getElementById('streakPill').textContent = (STREAK.count||0) + '🔥';
  if(name === 'home') renderHome();
  if(name === 'tinder') startTinder();
}

function renderCard(){
  const cardEl = document.getElementById('card');
  const rateRow = document.getElementById('rateRow');
  cardEl.classList.remove('flipped');
  rateRow.style.visibility = 'hidden';

  if(position >= ORDER.length){
    document.getElementById('faceFront').innerHTML = `<div class="empty-state"><div class="big">Drawer closed.</div><div>You cleared every card in ${currentCat}.</div></div>`;
    document.getElementById('faceBack').innerHTML = '';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressCount').textContent = `${ORDER.length}/${ORDER.length}`;
    return;
  }
  const p = ORDER[position];
  document.getElementById('progressFill').style.width = Math.round(100*position/ORDER.length) + '%';
  document.getElementById('progressCount').textContent = `${position+1}/${ORDER.length}`;

  document.getElementById('faceFront').innerHTML = `
    <div class="face-eyebrow"><span class="diff-tag diff-${p.difficulty}">${p.difficulty}</span></div>
    <div class="prob-name">${p.name}</div>
    <div class="prob-prompt">${p.prompt}</div>
    <div class="prob-example">${p.example}</div>
    <div class="flip-hint">tap card to flip</div>
  `;
  document.getElementById('faceBack').innerHTML = `
    <div class="face-eyebrow"><span class="diff-tag diff-${p.difficulty}">${p.difficulty}</span><span style="flex:1;">${p.pattern}</span><a class="leet-link" href="${p.url}" target="_blank" rel="noopener">leetcode ↗</a></div>
    <div class="prob-name" style="font-size:16px;">${p.name}</div>
    <h3>Key insight</h3>
    <div class="insight">${p.insight}</div>
    <h3>Complexity</h3>
    <div class="complexity"><span>time ${p.time}</span><span>space ${p.space}</span></div>
    <h3>Approach</h3>
    <pre class="code">${highlightCode(p.code)}</pre>
  `;
}

document.getElementById('card').addEventListener('click', () => {
  const cardEl = document.getElementById('card');
  if(position >= ORDER.length) return;
  cardEl.classList.toggle('flipped');
  document.getElementById('rateRow').style.visibility = cardEl.classList.contains('flipped') ? 'visible' : 'hidden';
});

document.getElementById('rateRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.rate-btn');
  if(!btn) return;
  const grade = parseInt(btn.dataset.rate, 10);
  const p = ORDER[position];
  rate(p.id, grade);
  position++;
  renderCard();
});

document.getElementById('backBtn').addEventListener('click', () => showView('home'));
document.getElementById('homeBackBtn').addEventListener('click', () => showView('root'));
document.getElementById('dueBanner').addEventListener('click', startDueAll);
document.getElementById('modeListBtn').addEventListener('click', () => showView('home'));
document.getElementById('modeTinderBtn').addEventListener('click', () => showView('tinder'));
document.getElementById('tinderBackBtn').addEventListener('click', () => showView('root'));

/* =========================================================
   TINDER MODE
   ========================================================= */
let TDECK = [];
let TPOS = 0;

function buildTinderDeck(){
  const due = NC150.filter(p => isDue(p.id));
  const pool = due.length ? due : NC150.slice();
  TDECK = pool.slice().sort(() => Math.random() - 0.5);
  TPOS = 0;
}

function startTinder(){
  buildTinderDeck();
  renderTinderSub();
  paintTinderStage();
}

function renderTinderSub(){
  document.getElementById('tinderSub').textContent = `${Math.max(TDECK.length - TPOS, 0)} in this round`;
}

function tinderFaceHTML(p, isBack){
  if(!isBack){
    return `
      <div class="face-eyebrow"><span class="diff-tag diff-${p.difficulty}">${p.difficulty}</span></div>
      <div class="prob-name">${p.name}</div>
      <div class="prob-prompt">${p.prompt}</div>
      <div class="prob-example">${p.example}</div>
      <div class="flip-hint">tap to reveal</div>
    `;
  }
  return `
    <div class="face-eyebrow"><span class="diff-tag diff-${p.difficulty}">${p.difficulty}</span><span style="flex:1;">${p.pattern}</span><a class="leet-link" href="${p.url}" target="_blank" rel="noopener">leetcode ↗</a></div>
    <div class="prob-name" style="font-size:16px;">${p.name}</div>
    <h3>Key insight</h3>
    <div class="insight">${p.insight}</div>
    <h3>Complexity</h3>
    <div class="complexity"><span>time ${p.time}</span><span>space ${p.space}</span></div>
    <h3>Approach</h3>
    <pre class="code">${highlightCode(p.code)}</pre>
  `;
}

function buildTinderCardEl(p, layer){
  const wrap = document.createElement('div');
  wrap.className = 'tswipe-wrap ' + layer;
  wrap.innerHTML = `
    <div class="tcard">
      <div class="tcard-inner">
        <div class="face front">${tinderFaceHTML(p, false)}</div>
        <div class="face back">${tinderFaceHTML(p, true)}</div>
      </div>
      <div class="stamp hard">HARD</div>
      <div class="stamp easy">EASY</div>
    </div>
  `;
  return wrap;
}

function paintTinderStage(){
  const stage = document.getElementById('tinderStage');
  stage.innerHTML = '';
  renderTinderSub();

  if(TPOS >= TDECK.length){
    stage.innerHTML = `<div class="empty-state"><div class="big">Round complete.</div><div>Reshuffling for another pass.</div></div>`;
    setTimeout(() => { buildTinderDeck(); paintTinderStage(); }, 1200);
    return;
  }

  // behind card (peek), for visual depth
  if(TPOS + 1 < TDECK.length){
    stage.appendChild(buildTinderCardEl(TDECK[TPOS+1], 'behind'));
  }
  const topWrap = buildTinderCardEl(TDECK[TPOS], 'top');
  stage.appendChild(topWrap);
  wireTinderDrag(topWrap, TDECK[TPOS]);
}

function wireTinderDrag(wrap, problem){
  const tcard = wrap.querySelector('.tcard');
  const inner = wrap.querySelector('.tcard-inner');
  const stampHard = wrap.querySelector('.stamp.hard');
  const stampEasy = wrap.querySelector('.stamp.easy');
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, pointerId = null, moved = false;

  function onDown(e){
    pointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    dx = 0; dy = 0; dragging = true; moved = false;
    wrap.classList.add('dragging');
    wrap.classList.remove('snap-back');
    tcard.setPointerCapture && tcard.setPointerCapture(pointerId);
  }
  function onMove(e){
    if(!dragging) return;
    dx = e.clientX - startX;
    dy = e.clientY - startY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    const rot = dx / 18;
    wrap.style.transform = `translate(${dx}px, ${dy*0.4}px) rotate(${rot}deg)`;
    const progress = Math.min(Math.abs(dx) / 120, 1);
    if(dx < 0){ stampHard.style.opacity = progress; stampEasy.style.opacity = 0; }
    else if(dx > 0){ stampEasy.style.opacity = progress; stampHard.style.opacity = 0; }
    else { stampHard.style.opacity = 0; stampEasy.style.opacity = 0; }
  }
  function onUp(e){
    if(!dragging) return;
    dragging = false;
    wrap.classList.remove('dragging');
    const threshold = 100;
    if(!moved){
      inner.classList.toggle('flipped');
      wrap.style.transform = '';
      return;
    }
    if(dx <= -threshold){
      commitSwipe(wrap, problem, -1);
    } else if(dx >= threshold){
      commitSwipe(wrap, problem, 1);
    } else {
      wrap.classList.add('snap-back');
      wrap.style.transform = '';
      stampHard.style.opacity = 0;
      stampEasy.style.opacity = 0;
    }
  }
  tcard.addEventListener('pointerdown', onDown);
  tcard.addEventListener('pointermove', onMove);
  tcard.addEventListener('pointerup', onUp);
  tcard.addEventListener('pointercancel', onUp);
}

function commitSwipe(wrap, problem, direction){
  // direction -1 = left = hard, +1 = right = easy
  wrap.classList.add('fly-out');
  const flyX = direction * 600;
  wrap.style.transform = `translate(${flyX}px, -40px) rotate(${direction * 30}deg)`;
  wrap.style.opacity = '0';
  const grade = direction < 0 ? 1 : 3; // hard : easy
  rate(problem.id, grade);
  setTimeout(() => {
    TPOS++;
    paintTinderStage();
  }, 260);
}

document.getElementById('tinderHardBtn').addEventListener('click', () => {
  if(TPOS >= TDECK.length) return;
  const wrap = document.querySelector('.tswipe-wrap.top');
  if(wrap) commitSwipe(wrap, TDECK[TPOS], -1);
});
document.getElementById('tinderEasyBtn').addEventListener('click', () => {
  if(TPOS >= TDECK.length) return;
  const wrap = document.querySelector('.tswipe-wrap.top');
  if(wrap) commitSwipe(wrap, TDECK[TPOS], 1);
});

(async function init(){
  await loadState();
  showView('root');
})();
</script>
