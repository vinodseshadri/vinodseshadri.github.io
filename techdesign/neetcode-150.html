<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Catalog — NeetCode 150</title>
<style>
  :root{
    --ink:#20232c;
    --paper:#efe8d8;
    --paper-shadow:#d9d0b8;
    --drawer:#171a22;
    --drawer-2:#1f2330;
    --brass:#c98f3a;
    --brass-soft:#e8b565;
    --sage:#4c8577;
    --rust:#a24d3d;
    --line:#c9bfa2;
    --ink-soft:#5a5645;
    display-face: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    mono-face: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--drawer);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.02), transparent 40%);
    color:var(--paper);
    font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  #app{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    width:100%;
    height:100%;
    padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  /* ---------- Header / drawer label ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:10px;
    border-bottom:1px solid rgba(232,181,101,0.25);
    margin-bottom:12px;
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
  }
  .brand .tab{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--brass-soft);
    border:1px solid rgba(232,181,101,0.4);
    padding:2px 6px;
    border-radius:3px;
    text-transform:uppercase;
  }
  .brand h1{
    font-size:19px;
    margin:0;
    font-weight:600;
    letter-spacing:0.01em;
    color:#f3ecd8;
  }
  .stat-pill{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:11px;
    color:var(--drawer);
    background:var(--brass-soft);
    padding:5px 9px;
    border-radius:20px;
    font-weight:700;
    letter-spacing:0.02em;
  }

  /* ---------- Views ---------- */
  .view{ flex:1; min-height:0; display:none; flex-direction:column; }
  .view.active{ display:flex; }

  /* ---- Home / drawer index ---- */
  #view-home{ overflow-y:auto; padding-bottom:8px; }
  .home-lead{
    font-size:13px;
    color:#b9b199;
    line-height:1.5;
    margin: 2px 0 16px;
  }
  .due-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, var(--brass) 0%, #a9711f 100%);
    color:#1b1305;
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:18px;
    cursor:pointer;
    border:none;
    width:100%;
    font-family:inherit;
    text-align:left;
  }
  .due-banner .num{ font-size:26px; font-weight:700; font-family: ui-monospace, monospace; line-height:1; }
  .due-banner .lbl{ font-size:12px; font-weight:600; letter-spacing:0.03em; margin-top:2px; opacity:0.85;}
  .due-banner .go{ font-size:13px; font-weight:700; }
  .due-banner:disabled{ opacity:0.4; cursor:default; }

  .cat-list{ display:flex; flex-direction:column; gap:1px; }
  .cat-row{
    display:flex; align-items:center; gap:12px;
    background:var(--drawer-2);
    padding:12px 12px;
    cursor:pointer;
    border:none;
    color:inherit;
    font-family:inherit;
    text-align:left;
    width:100%;
    border-left:3px solid transparent;
  }
  .cat-row:first-child{ border-top-left-radius:8px; border-top-right-radius:8px; }
  .cat-row:last-child{ border-bottom-left-radius:8px; border-bottom-right-radius:8px; }
  .cat-row .idx{
    font-family: ui-monospace, monospace;
    font-size:10px;
    color:var(--ink-soft);
    background:rgba(239,232,216,0.06);
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    border-radius:4px;
    flex-shrink:0;
    color:#8f8a76;
  }
  .cat-row .name{ flex:1; font-size:14.5px; color:#e9e2cd; }
  .cat-row .count{ font-family: ui-monospace, monospace; font-size:11px; color:#8f8a76; }
  .cat-row .mastery{ width:34px; height:4px; border-radius:2px; background:rgba(255,255,255,0.08); overflow:hidden; flex-shrink:0;}
  .cat-row .mastery i{ display:block; height:100%; background:var(--sage); }
  .cat-row.has-due{ border-left-color:var(--brass-soft); }

  /* ---- Study view ---- */
  #view-study{ }
  .study-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .back-btn{
    background:none; border:none; color:#c9bfa2; font-family: ui-monospace, monospace;
    font-size:12px; cursor:pointer; padding:6px 0; letter-spacing:0.02em;
  }
  .progress-track{
    flex:1; height:3px; background:rgba(255,255,255,0.08); margin:0 12px; border-radius:2px; overflow:hidden;
  }
  .progress-track i{ display:block; height:100%; background:var(--brass-soft); width:0%; transition:width .25s; }
  .progress-count{ font-family: ui-monospace, monospace; font-size:11px; color:#8f8a76; }

  .card-stage{
    flex:1; position:relative; perspective:1400px; min-height:0;
    display:flex; align-items:stretch; justify-content:center;
    padding: 6px 0 4px;
  }
  .card{
    position:relative; width:100%; transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    box-shadow:0 10px 0 -3px var(--paper-shadow), 0 18px 30px rgba(0,0,0,0.45);
    padding:20px 20px 16px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .face::before{
    content:"";
    position:absolute; top:14px; right:14px;
    width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff, var(--drawer) 70%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    opacity:0.5;
  }
  .face.back{ transform:rotateY(180deg); overflow-y:auto; -webkit-user-select:text; user-select:text;}
  .face-eyebrow{
    display:flex; align-items:center; gap:8px;
    font-family: ui-monospace, monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:10px;
  }
  .diff-tag{ padding:2px 7px; border-radius:3px; font-weight:700; }
  .diff-Easy{ background:#dcebd4; color:#3d6b2f; }
  .diff-Medium{ background:#f3e2c2; color:#8a5a12; }
  .diff-Hard{ background:#f0d3ce; color:#8f3322; }
  .diff-Concept{ background:#dcd4ea; color:#4a3a7a; }

  .prob-name{ font-size:21px; font-weight:700; line-height:1.25; margin:0 0 8px; }
  .prob-prompt{ font-size:14px; line-height:1.55; color:#3a3627; flex:1; }
  .prob-example{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:12px; line-height:1.5; color:var(--ink-soft);
    background:#e4dcc4; border-radius:6px; padding:8px 10px;
    margin-top:10px; white-space:pre-wrap; word-break:break-word;
  }
  .flip-hint{
    text-align:center; font-family: ui-monospace, monospace; font-size:10.5px;
    color:var(--ink-soft); letter-spacing:0.06em; text-transform:uppercase;
    padding-top:8px; border-top:1px dashed var(--line); margin-top:10px;
  }

  .back h3{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin:12px 0 6px; }
  .back h3:first-of-type{ margin-top:0; }
  .insight{ font-size:14px; line-height:1.5; color:#2e2b1f; background:#e4dcc4; border-left:3px solid var(--brass); padding:8px 10px; border-radius:0 6px 6px 0; }
  .complexity{ font-family: ui-monospace, monospace; font-size:12.5px; color:#3a3627; display:flex; gap:16px; }
  pre.code{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:12.2px; line-height:1.55; background:#1c1f27; color:#dbe4e0;
    padding:12px 12px; border-radius:8px; overflow-x:auto; white-space:pre;
    -webkit-user-select:text; user-select:text;
  }
  pre.code .kw{ color:#e8b565; }
  a.leet-link{ color:var(--rust); font-size:12px; font-family: ui-monospace, monospace; text-decoration:none; border-bottom:1px dotted var(--rust); }

  .rate-row{ display:flex; gap:8px; margin-top:14px; }
  .rate-btn{
    flex:1; padding:12px 4px; border-radius:9px; border:none; font-family: ui-monospace, monospace;
    font-size:11px; font-weight:700; letter-spacing:0.02em; cursor:pointer; color:#fff;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .rate-btn span.sub{ font-weight:400; opacity:0.75; font-size:9.5px; }
  .rate-again{ background:#8f3322; }
  .rate-hard{ background:#8a5a12; }
  .rate-good{ background:#3d6b2f; }
  .rate-easy{ background:#2f6e63; }

  .empty-state{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#8f8a76; gap:8px; }
  .empty-state .big{ font-size:15px; color:#e9e2cd; }

  /* ---------- Root: mode select ---------- */
  #view-root{ justify-content:center; gap:14px; }
  .mode-lead{ font-size:13px; color:#b9b199; line-height:1.5; margin: 2px 0 6px; text-align:center; }
  .mode-card{
    display:flex; flex-direction:column; gap:6px;
    background:var(--drawer-2);
    border:1px solid rgba(232,181,101,0.18);
    border-radius:14px;
    padding:22px 20px;
    cursor:pointer;
    text-align:left;
    color:inherit;
    font-family:inherit;
    width:100%;
    position:relative;
    overflow:hidden;
  }
  .mode-card .glyph{ font-size:26px; margin-bottom:2px; }
  .mode-card h2{ margin:0; font-size:18px; color:#f3ecd8; font-weight:700; }
  .mode-card p{ margin:0; font-size:12.5px; color:#8f8a76; line-height:1.5; font-family: ui-monospace, monospace; }
  .mode-card.list::before{
    content:""; position:absolute; top:0; right:0; width:70px; height:70px;
    background:linear-gradient(135deg, rgba(232,181,101,0.14), transparent 70%);
  }
  .mode-card.tinder::before{
    content:""; position:absolute; top:0; right:0; width:70px; height:70px;
    background:linear-gradient(135deg, rgba(76,133,119,0.22), transparent 70%);
  }
  .mode-card .arrow{ position:absolute; right:18px; bottom:18px; font-family: ui-monospace, monospace; font-size:12px; color:var(--brass-soft); }

  /* ---------- Tinder mode ---------- */
  #view-tinder{ }
  .tinder-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .tinder-sub{ font-family: ui-monospace, monospace; font-size:11px; color:#8f8a76; }
  .tinder-stage{
    flex:1; position:relative; min-height:0;
    display:flex; align-items:stretch; justify-content:center;
    padding: 4px 0 6px;
    touch-action:none;
  }
  .tswipe-wrap{
    position:absolute; inset:0;
    will-change:transform;
  }
  .tswipe-wrap.behind{ transform:scale(0.94) translateY(10px); opacity:0.6; z-index:1; }
  .tswipe-wrap.top{ z-index:2; }
  .tswipe-wrap.dragging{ transition:none; }
  .tswipe-wrap.snap-back{ transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .tswipe-wrap.fly-out{ transition:transform .4s ease-out, opacity .4s ease-out; }

  .tcard{
    position:relative; width:100%; height:100%; perspective:1400px; transform-style:preserve-3d; cursor:pointer;
  }
  .tcard-inner{
    position:relative; width:100%; height:100%; transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .tcard-inner.flipped{ transform:rotateY(180deg); }

  .stamp{
    position:absolute; top:26px; font-family: ui-monospace, monospace; font-weight:800; font-size:22px;
    padding:6px 14px; border:3px solid; border-radius:8px; letter-spacing:0.08em;
    opacity:0; pointer-events:none; z-index:5; transform:rotate(-18deg);
  }
  .stamp.hard{ left:20px; color:#c0493a; border-color:#c0493a; }
  .stamp.easy{ right:20px; color:#3d8b72; border-color:#3d8b72; transform:rotate(18deg); }

  .tinder-hint{
    text-align:center; font-family: ui-monospace, monospace; font-size:10.5px;
    color:#8f8a76; letter-spacing:0.05em; text-transform:uppercase; padding:10px 0 2px;
  }
  .tinder-rate-row{ display:flex; gap:10px; margin-top:6px; }
  .tinder-rate-btn{
    flex:1; padding:13px 4px; border-radius:10px; border:none; font-family: ui-monospace, monospace;
    font-size:12px; font-weight:700; letter-spacing:0.02em; cursor:pointer; color:#fff;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .tinder-rate-btn span.sub{ font-weight:400; opacity:0.8; font-size:9.5px; }
  .tinder-rate-hard{ background:#8a3a2c; }
  .tinder-rate-easy{ background:#2f6e63; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="tab">CATALOG</span>
      <h1 id="brandTitle">NeetCode 150</h1>
    </div>
    <div class="stat-pill" id="streakPill">0🔥</div>
  </header>

  <div id="view-root" class="view active">
    <p class="mode-lead">Two ways to study. Pick one.</p>
    <button class="mode-card list" id="modeListBtn">
      <div class="glyph">🗂️</div>
      <h2>List Mode</h2>
      <p>Browse the catalog by pattern, drill one drawer at a time, track mastery per category.</p>
      <div class="arrow">OPEN →</div>
    </button>
    <button class="mode-card tinder" id="modeTinderBtn">
      <div class="glyph">🔥</div>
      <h2>Tinder Mode</h2>
      <p>Random cards, one at a time. Tap to reveal, swipe left = hard, swipe right = easy.</p>
      <div class="arrow">OPEN →</div>
    </button>
  </div>

  <div id="view-home" class="view">
    <div class="study-top" style="margin-bottom:8px;">
      <button class="back-btn" id="homeBackBtn">← MODES</button>
    </div>
    <p class="home-lead">150 problems (Blind 75 fully included), filed by pattern. Pull a drawer, review what's due, rate your recall — the schedule does the rest.</p>
    <button class="due-banner" id="dueBanner">
      <div>
        <div class="num" id="dueNum">0</div>
        <div class="lbl">CARDS DUE TODAY</div>
      </div>
      <div class="go">REVIEW →</div>
    </button>
    <div class="cat-list" id="catList"></div>
  </div>

  <div id="view-study" class="view">
    <div class="study-top">
      <button class="back-btn" id="backBtn">← DRAWERS</button>
      <div class="progress-track"><i id="progressFill"></i></div>
      <div class="progress-count" id="progressCount">0/0</div>
    </div>
    <div class="card-stage">
      <div class="card" id="card">
        <div class="face front" id="faceFront"></div>
        <div class="face back" id="faceBack"></div>
      </div>
    </div>
    <div class="rate-row" id="rateRow" style="visibility:hidden;">
      <button class="rate-btn rate-again" data-rate="0">AGAIN<span class="sub">&lt;10m</span></button>
      <button class="rate-btn rate-hard" data-rate="1">HARD<span class="sub">1d</span></button>
      <button class="rate-btn rate-good" data-rate="2">GOOD<span class="sub">3d</span></button>
      <button class="rate-btn rate-easy" data-rate="3">EASY<span class="sub">7d+</span></button>
    </div>
  </div>

  <div id="view-tinder" class="view">
    <div class="tinder-top">
      <button class="back-btn" id="tinderBackBtn">← MODES</button>
      <div class="tinder-sub" id="tinderSub">0 in this round</div>
    </div>
    <div class="tinder-stage" id="tinderStage"></div>
    <div class="tinder-hint" id="tinderHint">tap to reveal · swipe when ready</div>
    <div class="tinder-rate-row">
      <button class="tinder-rate-btn tinder-rate-hard" id="tinderHardBtn">← HARD<span class="sub">revisit in a couple days</span></button>
      <button class="tinder-rate-btn tinder-rate-easy" id="tinderEasyBtn">EASY →<span class="sub">revisit much later</span></button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATA — NeetCode 150
   ========================================================= */
const NC150 = [{"id":"contains-duplicate","name":"Contains Duplicate","difficulty":"Easy","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/contains-duplicate/","prompt":"You're given an integer array nums. Return true if any value appears at least twice in the array, and false if every element is distinct.","example":"Input: nums = [1,2,3,1] → Output: true","insight":"Throw every value into a set as you go. If a value is already in the set, you found your duplicate — no need to sort or compare pairs.","time":"O(n)","space":"O(n)","code":"def containsDuplicate(nums):\n    seen = set()\n    for n in nums:\n        if n in seen:\n            return True\n        seen.add(n)\n    return False"},{"id":"valid-anagram","name":"Valid Anagram","difficulty":"Easy","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/valid-anagram/","prompt":"You're given two strings s and t. Return true if t is an anagram of s, meaning it uses exactly the same letters with the same frequencies, just rearranged.","example":"Input: s = \"anagram\", t = \"nagaram\" → Output: true","insight":"Anagrams share the exact same letter counts. Build a frequency map of s, decrement while walking t; any negative count or leftover means it's not an anagram.","time":"O(n)","space":"O(1) — bounded alphabet","code":"from collections import Counter\ndef isAnagram(s, t):\n    if len(s) != len(t):\n        return False\n    return Counter(s) == Counter(t)"},{"id":"two-sum","name":"Two Sum","difficulty":"Easy","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/two-sum/","prompt":"You're given an array of integers nums and an integer target. Return the indices of the two numbers that add up to target — you may assume exactly one valid pair exists, and you can't use the same element twice.","example":"Input: nums = [2,7,11,15], target = 9 → Output: [0,1]","insight":"For each number, check if (target - number) was already seen. A hashmap of value→index turns an O(n^2) pair search into a single pass.","time":"O(n)","space":"O(n)","code":"def twoSum(nums, target):\n    seen = {}\n    for i, n in enumerate(nums):\n        need = target - n\n        if need in seen:\n            return [seen[need], i]\n        seen[n] = i"},{"id":"group-anagrams","name":"Group Anagrams","difficulty":"Medium","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/group-anagrams/","prompt":"You're given an array of strings strs. Group the strings into lists so that all anagrams of each other end up in the same list; return the groups in any order.","example":"Input: strs = [\"eat\",\"tea\",\"tan\",\"ate\",\"nat\",\"bat\"] → Output: [[\"bat\"],[\"nat\",\"tan\"],[\"ate\",\"eat\",\"tea\"]]","insight":"Anagrams collapse to the same signature if you sort their letters (or use a 26-length count tuple as a key). Group strings in a dict keyed by that signature.","time":"O(n * k log k)","space":"O(n * k)","code":"from collections import defaultdict\ndef groupAnagrams(strs):\n    groups = defaultdict(list)\n    for s in strs:\n        key = tuple(sorted(s))\n        groups[key].append(s)\n    return list(groups.values())"},{"id":"top-k-frequent","name":"Top K Frequent Elements","difficulty":"Medium","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/top-k-frequent-elements/","prompt":"You're given an integer array nums and an integer k. Return the k most frequently occurring elements, in any order; you can assume the answer is unique.","example":"Input: nums = [1,1,1,2,2,3], k = 2 → Output: [1,2]","insight":"Bucket sort by frequency: an array where index = frequency, value = list of numbers with that frequency. Walk buckets from the end to collect the top k in O(n).","time":"O(n)","space":"O(n)","code":"from collections import Counter\ndef topKFrequent(nums, k):\n    count = Counter(nums)\n    buckets = [[] for _ in range(len(nums) + 1)]\n    for num, freq in count.items():\n        buckets[freq].append(num)\n    res = []\n    for freq in range(len(buckets) - 1, 0, -1):\n        for num in buckets[freq]:\n            res.append(num)\n            if len(res) == k:\n                return res\n    return res"},{"id":"product-except-self","name":"Product of Array Except Self","difficulty":"Medium","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/product-of-array-except-self/","prompt":"You're given an integer array nums. Return an array where each element is the product of all the other elements except itself — without using the division operator, and ideally in O(n) time.","example":"Input: nums = [1,2,3,4] → Output: [24,12,8,6]","insight":"Do two passes: a prefix-product pass left-to-right, then fold in a running suffix product right-to-left, multiplying into the same output array.","time":"O(n)","space":"O(1) extra (output array doesn't count)","code":"def productExceptSelf(nums):\n    n = len(nums)\n    res = [1] * n\n    prefix = 1\n    for i in range(n):\n        res[i] = prefix\n        prefix *= nums[i]\n    suffix = 1\n    for i in range(n - 1, -1, -1):\n        res[i] *= suffix\n        suffix *= nums[i]\n    return res"},{"id":"valid-sudoku","name":"Valid Sudoku","difficulty":"Medium","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/valid-sudoku/","prompt":"You're given a 9x9 Sudoku board, partially filled. Determine if it's valid so far: each row, each column, and each of the nine 3x3 sub-boxes must contain no repeated digits among the filled cells (empty cells marked '.' are ignored, and the board doesn't need to be solvable).","example":"Input: partially filled 9×9 board → Output: true if no row, column, or 3×3 box repeats a digit","insight":"Keep a set per row, per column, and per 3x3 box (indexed by r//3, c//3). For each filled cell, check all three sets before adding.","time":"O(1) — fixed 81 cells","space":"O(1)","code":"from collections import defaultdict\ndef isValidSudoku(board):\n    rows, cols, boxes = defaultdict(set), defaultdict(set), defaultdict(set)\n    for r in range(9):\n        for c in range(9):\n            v = board[r][c]\n            if v == '.':\n                continue\n            b = (r // 3, c // 3)\n            if v in rows[r] or v in cols[c] or v in boxes[b]:\n                return False\n            rows[r].add(v); cols[c].add(v); boxes[b].add(v)\n    return True"},{"id":"encode-decode-strings","name":"Encode and Decode Strings","difficulty":"Medium","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/encode-and-decode-strings/","prompt":"Design an algorithm to encode a list of strings into a single string, and a corresponding decode function that returns the original list of strings — the encoding must handle strings containing any characters, including your own delimiters.","example":"Input: [\"lint\",\"code\",\"love\",\"you\"] → Output: encode() then decode() returns the same list","insight":"Prefix each string with its length and a delimiter that can't be confused with digits, e.g. '5#hello'. Decoding just reads the length, skips '#', then slices exactly that many characters.","time":"O(n) total chars","space":"O(n)","code":"def encode(strs):\n    return ''.join(f'{len(s)}#{s}' for s in strs)\n\ndef decode(s):\n    res, i = [], 0\n    while i < len(s):\n        j = i\n        while s[j] != '#':\n            j += 1\n        length = int(s[i:j])\n        res.append(s[j+1:j+1+length])\n        i = j + 1 + length\n    return res"},{"id":"longest-consecutive-sequence","name":"Longest Consecutive Sequence","difficulty":"Medium","pattern":"Arrays & Hashing","url":"https://leetcode.com/problems/longest-consecutive-sequence/","prompt":"You're given an unsorted array of integers. Find the length of the longest run of consecutive integers present in the array (the numbers don't need to be adjacent in the array itself), and do it in O(n) time.","example":"Input: nums = [100,4,200,1,3,2] → Output: 4 (the run 1,2,3,4)","insight":"Put everything in a set. Only start counting a run from a number whose (n-1) is NOT in the set — that guarantees each run is only walked once, from its true start.","time":"O(n)","space":"O(n)","code":"def longestConsecutive(nums):\n    numSet = set(nums)\n    longest = 0\n    for n in numSet:\n        if n - 1 not in numSet:\n            length = 1\n            while n + length in numSet:\n                length += 1\n            longest = max(longest, length)\n    return longest"},{"id":"valid-palindrome","name":"Valid Palindrome","difficulty":"Easy","pattern":"Two Pointers","url":"https://leetcode.com/problems/valid-palindrome/","prompt":"You're given a string s. After converting all uppercase letters to lowercase and removing all non-alphanumeric characters, determine whether it reads the same forward and backward.","example":"Input: s = \"A man, a plan, a canal: Panama\" → Output: true","insight":"Walk two pointers inward from both ends, skipping non-alphanumeric characters as you go, and compare lowercased characters directly — no need to build a cleaned copy first.","time":"O(n)","space":"O(1)","code":"def isPalindrome(s):\n    l, r = 0, len(s) - 1\n    while l < r:\n        while l < r and not s[l].isalnum():\n            l += 1\n        while l < r and not s[r].isalnum():\n            r -= 1\n        if s[l].lower() != s[r].lower():\n            return False\n        l += 1; r -= 1\n    return True"},{"id":"two-sum-ii","name":"Two Sum II - Input Array Is Sorted","difficulty":"Medium","pattern":"Two Pointers","url":"https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/","prompt":"You're given a 1-indexed array of integers numbers that is already sorted in non-decreasing order, plus a target. Find two numbers that add up to target and return their indices as a 1-indexed pair — solve it in O(n) time using constant extra space.","example":"Input: numbers = [2,7,11,15], target = 9 → Output: [1,2] (1-indexed)","insight":"Because the array is sorted, a left/right pointer pair can move purposefully: sum too small → move left up, sum too big → move right down.","time":"O(n)","space":"O(1)","code":"def twoSum(numbers, target):\n    l, r = 0, len(numbers) - 1\n    while l < r:\n        s = numbers[l] + numbers[r]\n        if s == target:\n            return [l + 1, r + 1]\n        elif s < target:\n            l += 1\n        else:\n            r -= 1"},{"id":"3sum","name":"3Sum","difficulty":"Medium","pattern":"Two Pointers","url":"https://leetcode.com/problems/3sum/","prompt":"You're given an integer array nums. Find all unique triplets [nums[i], nums[j], nums[k]] (distinct indices) that sum to zero, and return them without duplicate triplets.","example":"Input: nums = [-1,0,1,2,-1,-4] → Output: [[-1,-1,2],[-1,0,1]]","insight":"Sort the array, fix one number, then two-pointer the rest for the remaining pair. Skip duplicate values at every position to avoid duplicate triplets.","time":"O(n^2)","space":"O(1) extra (excluding output)","code":"def threeSum(nums):\n    nums.sort()\n    res = []\n    for i in range(len(nums)):\n        if i > 0 and nums[i] == nums[i-1]:\n            continue\n        if nums[i] > 0:\n            break\n        l, r = i + 1, len(nums) - 1\n        while l < r:\n            s = nums[i] + nums[l] + nums[r]\n            if s < 0:\n                l += 1\n            elif s > 0:\n                r -= 1\n            else:\n                res.append([nums[i], nums[l], nums[r]])\n                l += 1\n                while l < r and nums[l] == nums[l-1]:\n                    l += 1\n    return res"},{"id":"container-most-water","name":"Container With Most Water","difficulty":"Medium","pattern":"Two Pointers","url":"https://leetcode.com/problems/container-with-most-water/","prompt":"You're given an array height where height[i] is the height of a vertical line at position i. Choose two lines that, together with the x-axis, form a container, and return the maximum amount of water it can hold.","example":"Input: height = [1,8,6,2,5,4,8,3,7] → Output: 49","insight":"Start pointers at both ends — width is maximal there. The shorter line is always the bottleneck, so move whichever pointer is shorter inward; moving the taller one can only shrink the area.","time":"O(n)","space":"O(1)","code":"def maxArea(height):\n    l, r = 0, len(height) - 1\n    best = 0\n    while l < r:\n        area = (r - l) * min(height[l], height[r])\n        best = max(best, area)\n        if height[l] < height[r]:\n            l += 1\n        else:\n            r -= 1\n    return best"},{"id":"trapping-rain-water","name":"Trapping Rain Water","difficulty":"Hard","pattern":"Two Pointers","url":"https://leetcode.com/problems/trapping-rain-water/","prompt":"You're given an array representing an elevation map where each bar has width 1. Compute how much water it can trap after raining, based on the bars to the left and right of each position.","example":"Input: height = [0,1,0,2,1,0,1,3,2,1,2,1] → Output: 6","insight":"Water trapped at any bar is min(max height to its left, max height to its right) minus its own height. Track running left-max and right-max with two pointers, always advancing the side with the smaller max.","time":"O(n)","space":"O(1)","code":"def trap(height):\n    l, r = 0, len(height) - 1\n    leftMax, rightMax = height[l], height[r]\n    water = 0\n    while l < r:\n        if leftMax < rightMax:\n            l += 1\n            leftMax = max(leftMax, height[l])\n            water += leftMax - height[l]\n        else:\n            r -= 1\n            rightMax = max(rightMax, height[r])\n            water += rightMax - height[r]\n    return water"},{"id":"best-time-buy-sell-stock","name":"Best Time to Buy and Sell Stock","difficulty":"Easy","pattern":"Sliding Window","url":"https://leetcode.com/problems/best-time-to-buy-and-sell-stock/","prompt":"You're given an array where prices[i] is the stock price on day i. You may buy on one day and sell on a later day — return the maximum profit achievable, or 0 if no profit is possible.","example":"Input: prices = [7,1,5,3,6,4] → Output: 5","insight":"Track the minimum price seen so far as you scan once; at each day, the best possible sell profit is today's price minus that running minimum.","time":"O(n)","space":"O(1)","code":"def maxProfit(prices):\n    minPrice = float('inf')\n    profit = 0\n    for p in prices:\n        minPrice = min(minPrice, p)\n        profit = max(profit, p - minPrice)\n    return profit"},{"id":"longest-substr-no-repeat","name":"Longest Substring Without Repeating Characters","difficulty":"Medium","pattern":"Sliding Window","url":"https://leetcode.com/problems/longest-substring-without-repeating-characters/","prompt":"You're given a string s. Find the length of the longest substring that doesn't contain any repeating characters.","example":"Input: s = \"abcabcbb\" → Output: 3 (\"abc\")","insight":"Grow a window with a right pointer, keeping a set of characters currently inside. Whenever a duplicate is hit, shrink from the left until the duplicate is gone.","time":"O(n)","space":"O(min(n, alphabet))","code":"def lengthOfLongestSubstring(s):\n    seen = set()\n    l = 0\n    best = 0\n    for r, c in enumerate(s):\n        while c in seen:\n            seen.remove(s[l])\n            l += 1\n        seen.add(c)\n        best = max(best, r - l + 1)\n    return best"},{"id":"longest-repeating-char-replacement","name":"Longest Repeating Character Replacement","difficulty":"Medium","pattern":"Sliding Window","url":"https://leetcode.com/problems/longest-repeating-character-replacement/","prompt":"You're given a string s and an integer k. You may replace up to k characters in the string with any other uppercase letter; return the length of the longest substring you can make consist of a single repeating letter.","example":"Input: s = \"ABAB\", k = 2 → Output: 4","insight":"A window is valid whenever (window length - count of its most frequent letter) <= k, since that's how many swaps it would take. Grow the window, and shrink from the left only when it becomes invalid.","time":"O(n)","space":"O(1) — 26 letters","code":"from collections import defaultdict\ndef characterReplacement(s, k):\n    count = defaultdict(int)\n    l = 0\n    maxFreq = 0\n    best = 0\n    for r, c in enumerate(s):\n        count[c] += 1\n        maxFreq = max(maxFreq, count[c])\n        while (r - l + 1) - maxFreq > k:\n            count[s[l]] -= 1\n            l += 1\n        best = max(best, r - l + 1)\n    return best"},{"id":"permutation-in-string","name":"Permutation in String","difficulty":"Medium","pattern":"Sliding Window","url":"https://leetcode.com/problems/permutation-in-string/","prompt":"You're given two strings s1 and s2. Return true if s2 contains a contiguous substring that is a permutation (anagram) of s1.","example":"Input: s1 = \"ab\", s2 = \"eidbaooo\" → Output: true","insight":"Slide a fixed-size window (length of s1) across s2, keeping running letter counts for the window and comparing to s1's counts. A match count of 26 means every letter frequency lines up.","time":"O(n)","space":"O(1) — 26 letters","code":"from collections import Counter\ndef checkInclusion(s1, s2):\n    if len(s1) > len(s2):\n        return False\n    need = Counter(s1)\n    window = Counter(s2[:len(s1)])\n    if window == need:\n        return True\n    for i in range(len(s1), len(s2)):\n        window[s2[i]] += 1\n        left = s2[i - len(s1)]\n        window[left] -= 1\n        if window[left] == 0:\n            del window[left]\n        if window == need:\n            return True\n    return False"},{"id":"min-window-substring","name":"Minimum Window Substring","difficulty":"Hard","pattern":"Sliding Window","url":"https://leetcode.com/problems/minimum-window-substring/","prompt":"You're given strings s and t. Find the smallest substring of s that contains every character of t, including duplicates — return an empty string if no such window exists.","example":"Input: s = \"ADOBECODEBANC\", t = \"ABC\" → Output: \"BANC\"","insight":"Expand the right edge until the window satisfies t's counts, tracking how many required characters are currently 'matched'. Then greedily shrink from the left while it's still valid, recording the smallest valid window found.","time":"O(n)","space":"O(alphabet)","code":"from collections import Counter, defaultdict\ndef minWindow(s, t):\n    if not t:\n        return ''\n    need = Counter(t)\n    window = defaultdict(int)\n    have, needCount = 0, len(need)\n    res, resLen = [-1, -1], float('inf')\n    l = 0\n    for r, c in enumerate(s):\n        window[c] += 1\n        if c in need and window[c] == need[c]:\n            have += 1\n        while have == needCount:\n            if (r - l + 1) < resLen:\n                res = [l, r]\n                resLen = r - l + 1\n            window[s[l]] -= 1\n            if s[l] in need and window[s[l]] < need[s[l]]:\n                have -= 1\n            l += 1\n    l, r = res\n    return s[l:r+1] if resLen != float('inf') else ''"},{"id":"sliding-window-maximum","name":"Sliding Window Maximum","difficulty":"Hard","pattern":"Sliding Window","url":"https://leetcode.com/problems/sliding-window-maximum/","prompt":"You're given an array nums and a window size k. As a window of size k slides from the left of the array to the right, return the maximum value in the window at each position.","example":"Input: nums = [1,3,-1,-3,5,3,6,7], k = 3 → Output: [3,3,5,5,6,7]","insight":"Keep a deque of indices with strictly decreasing values. Pop smaller values off the back before pushing (they can never be the max again), and pop the front when it slides out of the window. The front is always the current max.","time":"O(n)","space":"O(k)","code":"from collections import deque\ndef maxSlidingWindow(nums, k):\n    dq = deque()  # stores indices, values decreasing\n    res = []\n    for i, n in enumerate(nums):\n        while dq and nums[dq[-1]] < n:\n            dq.pop()\n        dq.append(i)\n        if dq[0] == i - k:\n            dq.popleft()\n        if i >= k - 1:\n            res.append(nums[dq[0]])\n    return res"},{"id":"valid-parentheses","name":"Valid Parentheses","difficulty":"Easy","pattern":"Stack","url":"https://leetcode.com/problems/valid-parentheses/","prompt":"You're given a string containing just the characters '(', ')', '{', '}', '[' and ']'. Determine if the input string is valid, meaning every opening bracket is closed by the same type of bracket in the correct order.","example":"Input: s = \"()[]{}\" → Output: true","insight":"Push opening brackets onto a stack. On a closing bracket, it must match whatever's on top of the stack (LIFO) — that's exactly what a stack models.","time":"O(n)","space":"O(n)","code":"def isValid(s):\n    stack = []\n    pairs = {')': '(', ']': '[', '}': '{'}\n    for c in s:\n        if c in pairs:\n            if not stack or stack.pop() != pairs[c]:\n                return False\n        else:\n            stack.append(c)\n    return not stack"},{"id":"min-stack","name":"Min Stack","difficulty":"Medium","pattern":"Stack","url":"https://leetcode.com/problems/min-stack/","prompt":"Design a stack that supports push, pop, top, and retrieving the minimum element, all in O(1) time.","example":"push(-2) → push(0) → push(-3) → getMin() → -3 → pop() → top() → 0 → getMin() → -2","insight":"Keep a second stack tracking the running minimum alongside the main one — push the current min each time so popping the main stack automatically 'undoes' the min tracking too.","time":"O(1) per op","space":"O(n)","code":"class MinStack:\n    def __init__(self):\n        self.stack = []\n        self.minStack = []\n    def push(self, val):\n        self.stack.append(val)\n        m = min(val, self.minStack[-1] if self.minStack else val)\n        self.minStack.append(m)\n    def pop(self):\n        self.stack.pop()\n        self.minStack.pop()\n    def top(self):\n        return self.stack[-1]\n    def getMin(self):\n        return self.minStack[-1]"},{"id":"evaluate-rpn","name":"Evaluate Reverse Polish Notation","difficulty":"Medium","pattern":"Stack","url":"https://leetcode.com/problems/evaluate-reverse-polish-notation/","prompt":"You're given an arithmetic expression in Reverse Polish (postfix) notation as an array of tokens. Evaluate it and return the integer result; division between two integers should truncate toward zero.","example":"Input: tokens = [\"2\",\"1\",\"+\",\"3\",\"*\"] → Output: 9","insight":"Push numbers onto a stack; whenever an operator is found, pop the last two numbers, apply the operator, and push the result back.","time":"O(n)","space":"O(n)","code":"def evalRPN(tokens):\n    stack = []\n    ops = {'+', '-', '*', '/'}\n    for t in tokens:\n        if t in ops:\n            b = stack.pop(); a = stack.pop()\n            if t == '+': stack.append(a + b)\n            elif t == '-': stack.append(a - b)\n            elif t == '*': stack.append(a * b)\n            else: stack.append(int(a / b))\n        else:\n            stack.append(int(t))\n    return stack[0]"},{"id":"generate-parentheses","name":"Generate Parentheses","difficulty":"Medium","pattern":"Stack","url":"https://leetcode.com/problems/generate-parentheses/","prompt":"You're given an integer n representing n pairs of parentheses. Generate and return all combinations of well-formed (balanced) parentheses strings that can be made with n pairs.","example":"Input: n = 3 → Output: [\"((()))\",\"(()())\",\"(())()\",\"()(())\",\"()()()\"]","insight":"Backtrack while tracking counts of open and close brackets used. You can add '(' if open < n, and ')' only if close < open — that constraint alone guarantees validity.","time":"O(4^n / sqrt(n))","space":"O(n) recursion depth","code":"def generateParenthesis(n):\n    res = []\n    def backtrack(cur, openC, closeC):\n        if len(cur) == 2 * n:\n            res.append(''.join(cur))\n            return\n        if openC < n:\n            cur.append('(')\n            backtrack(cur, openC + 1, closeC)\n            cur.pop()\n        if closeC < openC:\n            cur.append(')')\n            backtrack(cur, openC, closeC + 1)\n            cur.pop()\n    backtrack([], 0, 0)\n    return res"},{"id":"daily-temperatures","name":"Daily Temperatures","difficulty":"Medium","pattern":"Stack","url":"https://leetcode.com/problems/daily-temperatures/","prompt":"You're given an array of daily temperatures. For each day, find how many days you'd have to wait until a warmer temperature; if there's no future day that's warmer, put 0 for that day.","example":"Input: temperatures = [73,74,75,71,69,72,76,73] → Output: [1,1,4,2,1,1,0,0]","insight":"Keep a monotonic decreasing stack of indices whose 'warmer day' hasn't been found yet. When the current temperature beats the stack's top, pop it and record the day-gap.","time":"O(n)","space":"O(n)","code":"def dailyTemperatures(temperatures):\n    res = [0] * len(temperatures)\n    stack = []  # indices\n    for i, t in enumerate(temperatures):\n        while stack and temperatures[stack[-1]] < t:\n            j = stack.pop()\n            res[j] = i - j\n        stack.append(i)\n    return res"},{"id":"car-fleet","name":"Car Fleet","difficulty":"Medium","pattern":"Stack","url":"https://leetcode.com/problems/car-fleet/","prompt":"Cars all travel toward the same target position along a single lane, each starting at a given position with a given speed. A car that catches up to a slower car ahead of it merges into that car's fleet and travels at its speed from then on. Return the number of distinct fleets that will arrive at the target.","example":"Input: target = 12, position = [10,8,0,5,3], speed = [2,4,1,1,3] → Output: 3","insight":"Sort cars by starting position closest to target first, compute each car's arrival time. Process from closest to target outward: a car forms a new fleet only if its arrival time is later than the fleet ahead of it (a stack of arrival times).","time":"O(n log n)","space":"O(n)","code":"def carFleet(target, position, speed):\n    pairs = sorted(zip(position, speed), reverse=True)\n    stack = []\n    for pos, spd in pairs:\n        time = (target - pos) / spd\n        if not stack or time > stack[-1]:\n            stack.append(time)\n    return len(stack)"},{"id":"largest-rectangle-histogram","name":"Largest Rectangle in Histogram","difficulty":"Hard","pattern":"Stack","url":"https://leetcode.com/problems/largest-rectangle-in-histogram/","prompt":"You're given an array of bar heights forming a histogram, each bar with width 1. Find the area of the largest rectangle that can be formed within the histogram's bounds.","example":"Input: heights = [2,1,5,6,2,3] → Output: 10","insight":"Keep a stack of (start_index, height) pairs in increasing height order. When a shorter bar arrives, pop taller bars off, computing the rectangle each one could have formed extending back to where it was pushed.","time":"O(n)","space":"O(n)","code":"def largestRectangleArea(heights):\n    stack = []  # (start_index, height)\n    maxArea = 0\n    for i, h in enumerate(heights):\n        start = i\n        while stack and stack[-1][1] > h:\n            idx, height = stack.pop()\n            maxArea = max(maxArea, height * (i - idx))\n            start = idx\n        stack.append((start, h))\n    for idx, h in stack:\n        maxArea = max(maxArea, h * (len(heights) - idx))\n    return maxArea"},{"id":"binary-search","name":"Binary Search","difficulty":"Easy","pattern":"Binary Search","url":"https://leetcode.com/problems/binary-search/","prompt":"You're given a sorted array of integers and a target value. Return the index of target if it exists in the array, or -1 if it does not — your algorithm should run in O(log n) time.","example":"Input: nums = [-1,0,3,5,9,12], target = 9 → Output: 4","insight":"Halve the search space each step by comparing the target to the middle element. The classic template — the whole pattern's foundation.","time":"O(log n)","space":"O(1)","code":"def search(nums, target):\n    l, r = 0, len(nums) - 1\n    while l <= r:\n        mid = (l + r) // 2\n        if nums[mid] == target:\n            return mid\n        elif nums[mid] < target:\n            l = mid + 1\n        else:\n            r = mid - 1\n    return -1"},{"id":"search-2d-matrix","name":"Search a 2D Matrix","difficulty":"Medium","pattern":"Binary Search","url":"https://leetcode.com/problems/search-a-2d-matrix/","prompt":"You're given an m x n matrix where each row is sorted left to right, and the first integer of each row is greater than the last integer of the previous row. Determine whether a given target value exists in the matrix, in better than O(m*n) time.","example":"Input: matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3 → Output: true","insight":"Treat the matrix as one flat sorted array of length m*n. Binary search over that virtual index, converting back with divmod(idx, cols).","time":"O(log(m*n))","space":"O(1)","code":"def searchMatrix(matrix, target):\n    m, n = len(matrix), len(matrix[0])\n    l, r = 0, m * n - 1\n    while l <= r:\n        mid = (l + r) // 2\n        val = matrix[mid // n][mid % n]\n        if val == target:\n            return True\n        elif val < target:\n            l = mid + 1\n        else:\n            r = mid - 1\n    return False"},{"id":"koko-eating-bananas","name":"Koko Eating Bananas","difficulty":"Medium","pattern":"Binary Search","url":"https://leetcode.com/problems/koko-eating-bananas/","prompt":"Koko has piles of bananas and h hours before the guards return; each hour she picks one pile and eats up to k bananas from it (or the whole pile if it has fewer). Find the minimum integer eating speed k so she can finish all the piles within h hours.","example":"Input: piles = [3,6,7,11], h = 8 → Output: 4","insight":"Binary search on the answer itself (the speed k, range 1..max(piles)). For a candidate speed, compute hours needed with ceiling division; if it fits in h hours, try a smaller speed.","time":"O(n log(max(piles)))","space":"O(1)","code":"import math\ndef minEatingSpeed(piles, h):\n    l, r = 1, max(piles)\n    res = r\n    while l <= r:\n        k = (l + r) // 2\n        hours = sum(math.ceil(p / k) for p in piles)\n        if hours <= h:\n            res = k\n            r = k - 1\n        else:\n            l = k + 1\n    return res"},{"id":"find-min-rotated-sorted-array","name":"Find Minimum in Rotated Sorted Array","difficulty":"Medium","pattern":"Binary Search","url":"https://leetcode.com/problems/find-minimum-in-rotated-sorted-array/","prompt":"You're given an array of unique integers that was originally sorted in ascending order, then rotated at some unknown pivot. Find the minimum element of the array in O(log n) time.","example":"Input: nums = [3,4,5,1,2] → Output: 1","insight":"Compare the middle to the rightmost element: if mid > right, the minimum is somewhere to the right of mid; otherwise it's at mid or to the left. This tells you which half still contains the 'rotation point'.","time":"O(log n)","space":"O(1)","code":"def findMin(nums):\n    l, r = 0, len(nums) - 1\n    while l < r:\n        mid = (l + r) // 2\n        if nums[mid] > nums[r]:\n            l = mid + 1\n        else:\n            r = mid\n    return nums[l]"},{"id":"search-rotated-sorted-array","name":"Search in Rotated Sorted Array","difficulty":"Medium","pattern":"Binary Search","url":"https://leetcode.com/problems/search-in-rotated-sorted-array/","prompt":"You're given a sorted array of unique integers that has been rotated at an unknown pivot, and a target value. Return the index of target if it's in the array, or -1 if not — in O(log n) time.","example":"Input: nums = [4,5,6,7,0,1,2], target = 0 → Output: 4","insight":"At each step, one half of the array (left of mid or right of mid) is guaranteed to be normally sorted. Check which half is sorted, then check if the target lies in that half's range to decide which way to go.","time":"O(log n)","space":"O(1)","code":"def search(nums, target):\n    l, r = 0, len(nums) - 1\n    while l <= r:\n        mid = (l + r) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[l] <= nums[mid]:\n            if nums[l] <= target < nums[mid]:\n                r = mid - 1\n            else:\n                l = mid + 1\n        else:\n            if nums[mid] < target <= nums[r]:\n                l = mid + 1\n            else:\n                r = mid - 1\n    return -1"},{"id":"time-based-kv-store","name":"Time Based Key-Value Store","difficulty":"Medium","pattern":"Binary Search","url":"https://leetcode.com/problems/time-based-key-value-store/","prompt":"Design a time-based key-value store: set(key, value, timestamp) stores the value for the key at the given timestamp, and get(key, timestamp) returns the value that was set for that key with the largest timestamp less than or equal to the given timestamp (or an empty string if none exists).","example":"set(\"foo\",\"bar\",1) → get(\"foo\",1) → \"bar\" → get(\"foo\",4) → \"bar\" (no value set before 4 beats 1)","insight":"Store each key's (timestamp, value) pairs in a list — timestamps arrive in increasing order, so the list is naturally sorted. Binary search for the largest timestamp not exceeding the query.","time":"O(log n) per get, O(1) per set","space":"O(n)","code":"from collections import defaultdict\nclass TimeMap:\n    def __init__(self):\n        self.store = defaultdict(list)  # key -> [(timestamp, value)]\n    def set(self, key, value, timestamp):\n        self.store[key].append((timestamp, value))\n    def get(self, key, timestamp):\n        arr = self.store[key]\n        l, r = 0, len(arr) - 1\n        res = ''\n        while l <= r:\n            mid = (l + r) // 2\n            if arr[mid][0] <= timestamp:\n                res = arr[mid][1]\n                l = mid + 1\n            else:\n                r = mid - 1\n        return res"},{"id":"median-two-sorted-arrays","name":"Median of Two Sorted Arrays","difficulty":"Hard","pattern":"Binary Search","url":"https://leetcode.com/problems/median-of-two-sorted-arrays/","prompt":"You're given two sorted arrays nums1 and nums2 of possibly different sizes. Find the median of the combined, sorted set of both arrays, in O(log(m+n)) time.","example":"Input: nums1 = [1,3], nums2 = [2] → Output: 2.00000","insight":"Binary search on the partition point of the smaller array; the partition of the other array is then determined by the total left-half size needed. Adjust the partition until max(left side) <= min(right side) on both arrays.","time":"O(log(min(m,n)))","space":"O(1)","code":"def findMedianSortedArrays(nums1, nums2):\n    if len(nums1) > len(nums2):\n        nums1, nums2 = nums2, nums1\n    m, n = len(nums1), len(nums2)\n    l, r = 0, m\n    while l <= r:\n        i = (l + r) // 2\n        j = (m + n + 1) // 2 - i\n        left1 = nums1[i-1] if i > 0 else float('-inf')\n        right1 = nums1[i] if i < m else float('inf')\n        left2 = nums2[j-1] if j > 0 else float('-inf')\n        right2 = nums2[j] if j < n else float('inf')\n        if left1 <= right2 and left2 <= right1:\n            if (m + n) % 2:\n                return max(left1, left2)\n            return (max(left1, left2) + min(right1, right2)) / 2\n        elif left1 > right2:\n            r = i - 1\n        else:\n            l = i + 1"},{"id":"reverse-linked-list","name":"Reverse Linked List","difficulty":"Easy","pattern":"Linked List","url":"https://leetcode.com/problems/reverse-linked-list/","prompt":"You're given the head of a singly linked list. Reverse the list and return the new head.","example":"Input: 1→2→3→4→5 → Output: 5→4→3→2→1","insight":"Walk the list once, at each node flipping its 'next' pointer to point backward to the previous node, carrying prev/curr forward together.","time":"O(n)","space":"O(1)","code":"def reverseList(head):\n    prev = None\n    curr = head\n    while curr:\n        nxt = curr.next\n        curr.next = prev\n        prev = curr\n        curr = nxt\n    return prev"},{"id":"merge-two-sorted-lists","name":"Merge Two Sorted Lists","difficulty":"Easy","pattern":"Linked List","url":"https://leetcode.com/problems/merge-two-sorted-lists/","prompt":"You're given the heads of two sorted linked lists. Merge them into a single sorted linked list by splicing together the existing nodes, and return its head.","example":"Input: list1 = 1→2→4, list2 = 1→3→4 → Output: 1→1→2→3→4→4","insight":"Use a dummy head node and a tail pointer; repeatedly attach whichever list's current node is smaller, then advance that list. Append whatever's left over at the end.","time":"O(n + m)","space":"O(1)","code":"def mergeTwoLists(list1, list2):\n    dummy = tail = ListNode()\n    while list1 and list2:\n        if list1.val <= list2.val:\n            tail.next = list1\n            list1 = list1.next\n        else:\n            tail.next = list2\n            list2 = list2.next\n        tail = tail.next\n    tail.next = list1 or list2\n    return dummy.next"},{"id":"reorder-list","name":"Reorder List","difficulty":"Medium","pattern":"Linked List","url":"https://leetcode.com/problems/reorder-list/","prompt":"You're given the head of a singly linked list L0 → L1 → ... → Ln-1 → Ln. Reorder it in place to L0 → Ln → L1 → Ln-1 → L2 → Ln-2 → ... without modifying the node values.","example":"Input: 1→2→3→4 → Output: 1→4→2→3","insight":"Three steps: find the middle with slow/fast pointers, reverse the second half, then merge the two halves by alternating nodes.","time":"O(n)","space":"O(1)","code":"def reorderList(head):\n    slow, fast = head, head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n    second = slow.next\n    slow.next = None\n    prev = None\n    while second:\n        nxt = second.next\n        second.next = prev\n        prev = second\n        second = nxt\n    first, second = head, prev\n    while second:\n        n1, n2 = first.next, second.next\n        first.next = second\n        second.next = n1\n        first, second = n1, n2"},{"id":"remove-nth-node-from-end","name":"Remove Nth Node From End of List","difficulty":"Medium","pattern":"Linked List","url":"https://leetcode.com/problems/remove-nth-node-from-end-of-list/","prompt":"You're given the head of a linked list and an integer n. Remove the nth node from the end of the list and return the head — try to do it in a single pass.","example":"Input: head = 1→2→3→4→5, n = 2 → Output: 1→2→3→5","insight":"Move a 'fast' pointer n steps ahead first, then advance both fast and a trailing pointer together — when fast hits the end, the trailer is right before the node to remove.","time":"O(n)","space":"O(1)","code":"def removeNthFromEnd(head, n):\n    dummy = ListNode(0, head)\n    fast = slow = dummy\n    for _ in range(n):\n        fast = fast.next\n    while fast.next:\n        fast = fast.next\n        slow = slow.next\n    slow.next = slow.next.next\n    return dummy.next"},{"id":"copy-list-random-pointer","name":"Copy List with Random Pointer","difficulty":"Medium","pattern":"Linked List","url":"https://leetcode.com/problems/copy-list-with-random-pointer/","prompt":"You're given a linked list where each node has a next pointer and an additional random pointer that can point to any node in the list or null. Construct a deep copy of the list, preserving both sets of pointers.","example":"Input: a list where each node has next and random pointers → Output: a deep copy with identical structure","insight":"Two passes with a hashmap old_node -> new_node: first pass creates all new nodes, second pass wires up each new node's next and random using the map.","time":"O(n)","space":"O(n)","code":"def copyRandomList(head):\n    if not head:\n        return None\n    old_to_new = {}\n    curr = head\n    while curr:\n        old_to_new[curr] = Node(curr.val)\n        curr = curr.next\n    curr = head\n    while curr:\n        old_to_new[curr].next = old_to_new.get(curr.next)\n        old_to_new[curr].random = old_to_new.get(curr.random)\n        curr = curr.next\n    return old_to_new[head]"},{"id":"add-two-numbers","name":"Add Two Numbers","difficulty":"Medium","pattern":"Linked List","url":"https://leetcode.com/problems/add-two-numbers/","prompt":"You're given two non-empty linked lists representing two non-negative integers, with digits stored in reverse order (the ones digit first). Add the two numbers and return the sum as a linked list in the same reversed-digit format.","example":"Input: l1 = 2→4→3, l2 = 5→6→4 → Output: 7→0→8 (342 + 465 = 807)","insight":"Simulate elementary-school addition: walk both lists simultaneously, sum digits plus carry, create a new node for the result digit, and carry the overflow forward.","time":"O(max(n, m))","space":"O(max(n, m))","code":"def addTwoNumbers(l1, l2):\n    dummy = tail = ListNode()\n    carry = 0\n    while l1 or l2 or carry:\n        v1 = l1.val if l1 else 0\n        v2 = l2.val if l2 else 0\n        total = v1 + v2 + carry\n        carry = total // 10\n        tail.next = ListNode(total % 10)\n        tail = tail.next\n        l1 = l1.next if l1 else None\n        l2 = l2.next if l2 else None\n    return dummy.next"},{"id":"linked-list-cycle","name":"Linked List Cycle","difficulty":"Easy","pattern":"Linked List","url":"https://leetcode.com/problems/linked-list-cycle/","prompt":"You're given the head of a linked list. Determine if the list has a cycle, meaning some node's next pointer eventually loops back to a previously visited node.","example":"Input: 3→2→0→-4, tail connects back to node \"2\" → Output: true","insight":"Floyd's tortoise and hare: a slow pointer moves 1 step, a fast pointer moves 2. If there's a cycle they must eventually meet inside it; if fast reaches null, there's no cycle.","time":"O(n)","space":"O(1)","code":"def hasCycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow == fast:\n            return True\n    return False"},{"id":"find-duplicate-number","name":"Find the Duplicate Number","difficulty":"Medium","pattern":"Linked List","url":"https://leetcode.com/problems/find-the-duplicate-number/","prompt":"You're given an array of n+1 integers where each value is in the range [1, n]. There's exactly one number that repeats (possibly more than once) — find it without modifying the array and using only O(1) extra space.","example":"Input: nums = [1,3,4,2,2] → Output: 2","insight":"Treat the array as a linked list where index i points to index nums[i]. A duplicate value guarantees a cycle exists, so Floyd's cycle detection finds the entry point, which is exactly the duplicate.","time":"O(n)","space":"O(1)","code":"def findDuplicate(nums):\n    slow = fast = nums[0]\n    while True:\n        slow = nums[slow]\n        fast = nums[nums[fast]]\n        if slow == fast:\n            break\n    slow2 = nums[0]\n    while slow != slow2:\n        slow = nums[slow]\n        slow2 = nums[slow2]\n    return slow"},{"id":"lru-cache","name":"LRU Cache","difficulty":"Medium","pattern":"Linked List","url":"https://leetcode.com/problems/lru-cache/","prompt":"Design a Least Recently Used (LRU) cache with a fixed capacity. It should support get(key) and put(key, value) in O(1) average time, evicting the least recently used entry when the capacity is exceeded.","example":"LRUCache(2) → put(1,1) → put(2,2) → get(1) → 1 → put(3,3) evicts key 2 → get(2) → -1","insight":"Combine a hashmap (key -> node) with a doubly linked list ordered by recency. Every access moves a node to the front; evicting the LRU item just removes the tail.","time":"O(1) per op","space":"O(capacity)","code":"class Node:\n    def __init__(self, key, val):\n        self.key, self.val = key, val\n        self.prev = self.next = None\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.cache = {}\n        self.left, self.right = Node(0, 0), Node(0, 0)\n        self.left.next, self.right.prev = self.right, self.left\n    def remove(self, node):\n        node.prev.next, node.next.prev = node.next, node.prev\n    def insert(self, node):\n        prev, nxt = self.right.prev, self.right\n        prev.next = nxt.prev = node\n        node.prev, node.next = prev, nxt\n    def get(self, key):\n        if key in self.cache:\n            self.remove(self.cache[key])\n            self.insert(self.cache[key])\n            return self.cache[key].val\n        return -1\n    def put(self, key, value):\n        if key in self.cache:\n            self.remove(self.cache[key])\n        self.cache[key] = Node(key, value)\n        self.insert(self.cache[key])\n        if len(self.cache) > self.cap:\n            lru = self.left.next\n            self.remove(lru)\n            del self.cache[lru.key]"},{"id":"merge-k-sorted-lists","name":"Merge k Sorted Lists","difficulty":"Hard","pattern":"Linked List","url":"https://leetcode.com/problems/merge-k-sorted-lists/","prompt":"You're given an array of k sorted linked lists. Merge all of them into one sorted linked list and return its head.","example":"Input: lists = [[1,4,5],[1,3,4],[2,6]] → Output: [1,1,2,3,4,4,5,6]","insight":"Push each list's head into a min-heap keyed by value. Repeatedly pop the smallest, append it to the result, and push its successor if one exists.","time":"O(N log k)","space":"O(k)","code":"import heapq\ndef mergeKLists(lists):\n    heap = []\n    for i, node in enumerate(lists):\n        if node:\n            heapq.heappush(heap, (node.val, i, node))\n    dummy = tail = ListNode()\n    while heap:\n        val, i, node = heapq.heappop(heap)\n        tail.next = node\n        tail = tail.next\n        if node.next:\n            heapq.heappush(heap, (node.next.val, i, node.next))\n    return dummy.next"},{"id":"reverse-nodes-in-k-group","name":"Reverse Nodes in k-Group","difficulty":"Hard","pattern":"Linked List","url":"https://leetcode.com/problems/reverse-nodes-in-k-group/","prompt":"You're given the head of a linked list and an integer k. Reverse the nodes of the list k at a time and return the modified list; if the number of remaining nodes is less than k, leave that final group as-is.","example":"Input: head = 1→2→3→4→5, k = 2 → Output: 2→1→4→3→5","insight":"First check there are at least k nodes remaining. If so, reverse that group using the standard pointer-flip, then recursively (or iteratively) connect it to the reversed remainder.","time":"O(n)","space":"O(n/k) recursion or O(1) iterative","code":"def reverseKGroup(head, k):\n    node = head\n    for _ in range(k):\n        if not node:\n            return head\n        node = node.next\n    prev = reverseKGroup(node, k)\n    curr = head\n    for _ in range(k):\n        nxt = curr.next\n        curr.next = prev\n        prev = curr\n        curr = nxt\n    return prev"},{"id":"invert-binary-tree","name":"Invert Binary Tree","difficulty":"Easy","pattern":"Trees","url":"https://leetcode.com/problems/invert-binary-tree/","prompt":"You're given the root of a binary tree. Invert the tree (swap every node's left and right children) and return its new root.","example":"Input: root = [4,2,7,1,3,6,9] → Output: [4,7,2,9,6,3,1]","insight":"At every node, swap its left and right children, then recurse into both — a textbook top-down recursive tree traversal.","time":"O(n)","space":"O(h) recursion","code":"def invertTree(root):\n    if not root:\n        return None\n    root.left, root.right = invertTree(root.right), invertTree(root.left)\n    return root"},{"id":"max-depth-binary-tree","name":"Maximum Depth of Binary Tree","difficulty":"Easy","pattern":"Trees","url":"https://leetcode.com/problems/maximum-depth-of-binary-tree/","prompt":"You're given the root of a binary tree. Return its maximum depth, i.e. the number of nodes along the longest path from the root down to the farthest leaf.","example":"Input: root = [3,9,20,null,null,15,7] → Output: 3","insight":"The depth of a node is 1 + the max depth of its two children — a one-line recursive definition.","time":"O(n)","space":"O(h)","code":"def maxDepth(root):\n    if not root:\n        return 0\n    return 1 + max(maxDepth(root.left), maxDepth(root.right))"},{"id":"diameter-binary-tree","name":"Diameter of Binary Tree","difficulty":"Easy","pattern":"Trees","url":"https://leetcode.com/problems/diameter-of-binary-tree/","prompt":"You're given the root of a binary tree. Return the length (in edges) of the longest path between any two nodes in the tree — this path may or may not pass through the root.","example":"Input: root = [1,2,3,4,5] → Output: 3","insight":"While computing height recursively, also track the best 'left height + right height' seen at any node — that sum is the diameter through that node.","time":"O(n)","space":"O(h)","code":"def diameterOfBinaryTree(root):\n    best = 0\n    def height(node):\n        nonlocal best\n        if not node:\n            return 0\n        left = height(node.left)\n        right = height(node.right)\n        best = max(best, left + right)\n        return 1 + max(left, right)\n    height(root)\n    return best"},{"id":"balanced-binary-tree","name":"Balanced Binary Tree","difficulty":"Easy","pattern":"Trees","url":"https://leetcode.com/problems/balanced-binary-tree/","prompt":"You're given the root of a binary tree. Determine if it's height-balanced, meaning for every node, the heights of its left and right subtrees differ by no more than 1.","example":"Input: root = [3,9,20,null,null,15,7] → Output: true","insight":"Compute height bottom-up, returning -1 as a sentinel the moment any subtree is found unbalanced, so the check short-circuits instead of recomputing heights repeatedly.","time":"O(n)","space":"O(h)","code":"def isBalanced(root):\n    def height(node):\n        if not node:\n            return 0\n        left = height(node.left)\n        if left == -1:\n            return -1\n        right = height(node.right)\n        if right == -1:\n            return -1\n        if abs(left - right) > 1:\n            return -1\n        return 1 + max(left, right)\n    return height(root) != -1"},{"id":"same-tree","name":"Same Tree","difficulty":"Easy","pattern":"Trees","url":"https://leetcode.com/problems/same-tree/","prompt":"You're given the roots of two binary trees p and q. Return true if the trees are structurally identical and every corresponding node holds the same value.","example":"Input: p = [1,2,3], q = [1,2,3] → Output: true","insight":"Recurse together on both trees: values must match and both left subtrees and both right subtrees must recursively be the same.","time":"O(n)","space":"O(h)","code":"def isSameTree(p, q):\n    if not p and not q:\n        return True\n    if not p or not q or p.val != q.val:\n        return False\n    return isSameTree(p.left, q.left) and isSameTree(p.right, q.right)"},{"id":"subtree-of-another-tree","name":"Subtree of Another Tree","difficulty":"Easy","pattern":"Trees","url":"https://leetcode.com/problems/subtree-of-another-tree/","prompt":"You're given the roots of two binary trees, root and subRoot. Return true if there's a subtree of root whose structure and node values exactly match subRoot (subRoot must match a whole subtree, not just a partial match).","example":"Input: root = [3,4,5,1,2], subRoot = [4,1,2] → Output: true","insight":"Reuse 'same tree' as a helper: at every node of the main tree, check if the subtree rooted there is identical to subRoot.","time":"O(n * m)","space":"O(h)","code":"def isSubtree(root, subRoot):\n    def sameTree(p, q):\n        if not p and not q:\n            return True\n        if not p or not q or p.val != q.val:\n            return False\n        return sameTree(p.left, q.left) and sameTree(p.right, q.right)\n    if not root:\n        return False\n    if sameTree(root, subRoot):\n        return True\n    return isSubtree(root.left, subRoot) or isSubtree(root.right, subRoot)"},{"id":"lca-bst","name":"Lowest Common Ancestor of a BST","difficulty":"Medium","pattern":"Trees","url":"https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-search-tree/","prompt":"You're given the root of a binary search tree and two of its nodes, p and q. Find their lowest common ancestor — the deepest node that has both p and q as descendants (a node can be a descendant of itself).","example":"Input: root = [6,2,8,0,4,7,9,null,null,3,5], p = 2, q = 8 → Output: 6","insight":"Use the BST ordering property: if both target values are less than the current node, go left; if both greater, go right; otherwise the current node is the split point (the LCA).","time":"O(h)","space":"O(1)","code":"def lowestCommonAncestor(root, p, q):\n    curr = root\n    while curr:\n        if p.val < curr.val and q.val < curr.val:\n            curr = curr.left\n        elif p.val > curr.val and q.val > curr.val:\n            curr = curr.right\n        else:\n            return curr"},{"id":"binary-tree-level-order","name":"Binary Tree Level Order Traversal","difficulty":"Medium","pattern":"Trees","url":"https://leetcode.com/problems/binary-tree-level-order-traversal/","prompt":"You're given the root of a binary tree. Return the values of its nodes grouped level by level, from top to bottom, left to right within each level.","example":"Input: root = [3,9,20,null,null,15,7] → Output: [[3],[9,20],[15,7]]","insight":"Classic BFS with a queue: process one full level at a time by snapshotting the queue's current length before looping through it.","time":"O(n)","space":"O(n)","code":"from collections import deque\ndef levelOrder(root):\n    if not root:\n        return []\n    res = []\n    q = deque([root])\n    while q:\n        level = []\n        for _ in range(len(q)):\n            node = q.popleft()\n            level.append(node.val)\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        res.append(level)\n    return res"},{"id":"binary-tree-right-side-view","name":"Binary Tree Right Side View","difficulty":"Medium","pattern":"Trees","url":"https://leetcode.com/problems/binary-tree-right-side-view/","prompt":"You're given the root of a binary tree. Imagine standing on the right side of it — return the values of the nodes you can see, ordered from top to bottom.","example":"Input: root = [1,2,3,null,5,null,4] → Output: [1,3,4]","insight":"BFS level by level; the last node processed in each level (rightmost) is the one visible from the right side.","time":"O(n)","space":"O(n)","code":"from collections import deque\ndef rightSideView(root):\n    if not root:\n        return []\n    res = []\n    q = deque([root])\n    while q:\n        rightmost = None\n        for _ in range(len(q)):\n            node = q.popleft()\n            rightmost = node.val\n            if node.left: q.append(node.left)\n            if node.right: q.append(node.right)\n        res.append(rightmost)\n    return res"},{"id":"count-good-nodes","name":"Count Good Nodes in Binary Tree","difficulty":"Medium","pattern":"Trees","url":"https://leetcode.com/problems/count-good-nodes-in-binary-tree/","prompt":"You're given a binary tree root. A node X is 'good' if, on the path from the root to X, no node has a value greater than X's value. Count and return the number of good nodes in the tree.","example":"Input: root = [3,1,4,3,null,1,5] → Output: 4","insight":"DFS while carrying the maximum value seen so far on the current root-to-node path; a node is good exactly when its value >= that running max.","time":"O(n)","space":"O(h)","code":"def goodNodes(root):\n    def dfs(node, maxSoFar):\n        if not node:\n            return 0\n        good = 1 if node.val >= maxSoFar else 0\n        maxSoFar = max(maxSoFar, node.val)\n        good += dfs(node.left, maxSoFar) + dfs(node.right, maxSoFar)\n        return good\n    return dfs(root, root.val)"},{"id":"validate-bst","name":"Validate Binary Search Tree","difficulty":"Medium","pattern":"Trees","url":"https://leetcode.com/problems/validate-binary-search-tree/","prompt":"You're given the root of a binary tree. Determine if it is a valid binary search tree, meaning every node's left subtree contains only values less than the node, its right subtree contains only values greater, and this holds recursively for all subtrees.","example":"Input: root = [2,1,3] → Output: true","insight":"Carry a valid (low, high) range down through recursion — each node must fall strictly within its inherited bounds, and it tightens the bound for its children.","time":"O(n)","space":"O(h)","code":"def isValidBST(root):\n    def valid(node, low, high):\n        if not node:\n            return True\n        if not (low < node.val < high):\n            return False\n        return valid(node.left, low, node.val) and valid(node.right, node.val, high)\n    return valid(root, float('-inf'), float('inf'))"},{"id":"kth-smallest-bst","name":"Kth Smallest Element in a BST","difficulty":"Medium","pattern":"Trees","url":"https://leetcode.com/problems/kth-smallest-element-in-a-bst/","prompt":"You're given the root of a binary search tree and an integer k. Return the kth smallest value among all the node values in the tree (1-indexed).","example":"Input: root = [3,1,4,null,2], k = 1 → Output: 1","insight":"An in-order traversal of a BST visits nodes in sorted order — iteratively push left children onto a stack and pop k times to land on the kth smallest.","time":"O(h + k)","space":"O(h)","code":"def kthSmallest(root, k):\n    stack = []\n    curr = root\n    while True:\n        while curr:\n            stack.append(curr)\n            curr = curr.left\n        curr = stack.pop()\n        k -= 1\n        if k == 0:\n            return curr.val\n        curr = curr.right"},{"id":"construct-tree-preorder-inorder","name":"Construct Binary Tree from Preorder and Inorder Traversal","difficulty":"Medium","pattern":"Trees","url":"https://leetcode.com/problems/construct-binary-tree-from-preorder-and-inorder-traversal/","prompt":"You're given two integer arrays, preorder and inorder, representing the preorder and inorder traversal of a binary tree with unique values. Reconstruct and return the binary tree.","example":"Input: preorder = [3,9,20,15,7], inorder = [9,3,15,20,7] → Output: [3,9,20,null,null,15,7]","insight":"Preorder's first value is always the root. Find that value's position in inorder — everything left of it is the left subtree, everything right is the right subtree; recurse.","time":"O(n) with a hashmap for inorder positions","space":"O(n)","code":"def buildTree(preorder, inorder):\n    idx = {val: i for i, val in enumerate(inorder)}\n    self_i = [0]\n    def build(l, r):\n        if l > r:\n            return None\n        rootVal = preorder[self_i[0]]\n        self_i[0] += 1\n        root = TreeNode(rootVal)\n        mid = idx[rootVal]\n        root.left = build(l, mid - 1)\n        root.right = build(mid + 1, r)\n        return root\n    return build(0, len(inorder) - 1)"},{"id":"binary-tree-max-path-sum","name":"Binary Tree Maximum Path Sum","difficulty":"Hard","pattern":"Trees","url":"https://leetcode.com/problems/binary-tree-maximum-path-sum/","prompt":"You're given the root of a binary tree. A path is any non-empty sequence of nodes connected by edges, and each node can appear at most once. Return the maximum possible sum of any path in the tree — the path doesn't need to pass through the root.","example":"Input: root = [1,2,3] → Output: 6 (path 2→1→3)","insight":"For each node, compute the best downward path sum it can contribute upward (ignoring negative branches with max(...,0)), while separately tracking the best 'through this node' sum (left + right + node) as a global max.","time":"O(n)","space":"O(h)","code":"def maxPathSum(root):\n    best = [float('-inf')]\n    def dfs(node):\n        if not node:\n            return 0\n        left = max(dfs(node.left), 0)\n        right = max(dfs(node.right), 0)\n        best[0] = max(best[0], node.val + left + right)\n        return node.val + max(left, right)\n    dfs(root)\n    return best[0]"},{"id":"serialize-deserialize-binary-tree","name":"Serialize and Deserialize Binary Tree","difficulty":"Hard","pattern":"Trees","url":"https://leetcode.com/problems/serialize-and-deserialize-binary-tree/","prompt":"Design an algorithm to serialize a binary tree into a string, and a corresponding deserialize function that reconstructs the original tree from that string — the format is up to you, as long as a tree serialized then deserialized matches the original.","example":"Input: root = [1,2,3,null,null,4,5] → Output: deserialize(serialize(root)) reproduces the same tree","insight":"Preorder DFS, writing 'N' for null nodes as explicit markers. Deserializing just replays the same preorder recursion, consuming tokens one at a time — the null markers make the shape unambiguous.","time":"O(n)","space":"O(n)","code":"def serialize(root):\n    res = []\n    def dfs(node):\n        if not node:\n            res.append('N')\n            return\n        res.append(str(node.val))\n        dfs(node.left)\n        dfs(node.right)\n    dfs(root)\n    return ','.join(res)\n\ndef deserialize(data):\n    vals = iter(data.split(','))\n    def build():\n        val = next(vals)\n        if val == 'N':\n            return None\n        node = TreeNode(int(val))\n        node.left = build()\n        node.right = build()\n        return node\n    return build()"},{"id":"implement-trie","name":"Implement Trie (Prefix Tree)","difficulty":"Medium","pattern":"Tries","url":"https://leetcode.com/problems/implement-trie-prefix-tree/","prompt":"Implement a trie (prefix tree) with insert(word), search(word) (returns true only if the exact word was inserted), and startsWith(prefix) (returns true if any inserted word begins with that prefix).","example":"insert(\"apple\") → search(\"apple\") → true → search(\"app\") → false → startsWith(\"app\") → true","insight":"Each node holds a dict of child characters and an end-of-word flag. Insert/searc
